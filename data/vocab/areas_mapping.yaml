# 区域名の承認済み対応表（P6 SKILL.md）。
# ここに行が無いものは名寄せしない。
#
# 【承認の経緯】2026-08-29
#   プロジェクトオーナー（ryoma@senspace.studio）からの明示的な委任を受け、
#   エージェント（Claude）が cells.sqlite の原文引用のみを根拠に判定した。
#   ドメイン専門家（神奈川県自然環境保全課等）のレビューは受けていない。
#   各行の evidence に原文をそのまま記載してあるので、必ず原文で検証してから運用に乗せること。
#
# 【判定の原則】
#   - 原文が「同一である」と明示しているものだけを名寄せする。
#   - 原文が「別である／包含関係にある」と示しているものは名寄せしない。
#     その関係は relations_do_not_merge に別情報として記録する（名寄せ処理には使わない）。
#   - 原文に記載がないものは、似ていても名寄せしない。

# =============================================================================
# 承認: ニホンジカ管理計画の管理区分名（計画期をまたぐ改称）
# =============================================================================
mappings:
  - canonical: "定着防止区域"
    aliases:
      - "分布拡大防止区域"
      - "監視区域"
    scope: >-
      神奈川県ニホンジカ保護管理計画／管理計画の管理区分名。
      同一の管理区分が計画期ごとに改称された「名称の系譜」としての同一視。
    periods:
      - {name: "監視区域",         plan: "第2次保護管理計画"}
      - {name: "分布拡大防止区域", plan: "第3次計画",         years: "2012-2016 (平成24-28)"}
      - {name: "定着防止区域",     plan: "第4次以降",         years: "2017- (平成29-)"}
    evidence:
      - source: "cells.sqlite notes.tanzawa_shika_plan5_n001 (tanzawa_shika_plan5 p.2)"
        quote: "（※第3次計画中は「分布拡大防止区域」、第2次計画中は「監視区域」）"
      - source: "cells.sqlite notes.tanzawa_shika_plan5_n004 (tanzawa_shika_plan5 p.43)"
        quote: "区分の「定着防止区域」の2012（平成24）〜2016（平成28）年度における名称は「分布拡大防止区域」。"
      - source: "cells.sqlite cells.tanzawa_shika_r6 / tanzawa_shika_r4 の row_key"
        quote: "定着防止区域合計(H28まで分布拡大防止区域)"
        note: >-
          県自身の表の行見出しが改称をインラインで併記しており、
          我々の推測ではなく原資料の記述である。
    approved_by: "agent:Claude (delegated by human:ryoma@senspace.studio, 2026-08-29)"
    # --- 名寄せしてよい範囲の限定（重要） ---
    limitation: >-
      同一性が原文で確認できるのは「名称」だけである。区域の地理的境界が計画期を通じて
      不変であることは原資料のどこにも書かれておらず、未検証である。
      したがってこの対応表は「同じ管理区分の系譜として時系列を接続してよい」ことを意味するが、
      「同じ面積・同じ範囲を指す」ことは保証しない。
    caveat_extent_changed: >-
      実際に内訳の粒度は変化している。tanzawa_shika_r4 では定着防止区域(県実施分)の内訳が
      3区分(d,e,f)だが、tanzawa_shika_r6 では5区分(d,e,f,g,h。県森林担当部局・県自然公園担当部局・
      国立公園管理者・国有林管理者を独立行として分離)になっている。同じ「計」ラベルでも
      年度により内包範囲が異なりうるため、行ラベルの一致だけで合計値を接続しないこと
      （docs/P5_triage.md「人間の判断が必要な項目」参照）。

# =============================================================================
# 否認: 水源関連の4語 — 原文が「非同一」を明示している
# =============================================================================
# yaml の旧コメントには
#     canonical: "水源保全地域" / aliases: ["水源の森林エリア", "地域水源林エリア"]
# というフォーマット例が書かれていたが、これは原文に照らして誤りである。
# 名寄せしてはならない。原文の定義は以下のとおり（data/vocab/_p0p4_suigen_hozen.json、
# 出典 suigen_hozen_final_eval）:
#
#   水源保全地域   : 「主として、県外上流域を含めたダム上流域を中心に、河川水及び地下水の
#                     取水地点の集水域全体（水源保全地域）」(p.22-23)
#   水源の森林エリア: 「本県の広域的な水源であるダム水源等を保全する上で重要な県内の森林の区域」(p.23,26)
#   地域水源林エリア: 「…集水域のうち、水源の森林エリアを除いた区域」(p.23,26)
#                     ← 「水源の森林エリアを除いた」と明記 = 両者は互いに排他
#   ダム集水域     : 定義文なし（found_definition=false）。ただし cells p.54 に
#                     「県内水源保全地域の生活排水処理率 95.5% / うちダム集水域の生活排水処理率 74.1%」
#                     とあり、「うち」が包含関係を示す = ダム集水域 ⊂ 県内水源保全地域
#
# 階層・排他の関係は「名寄せ」ではない情報として以下に記録する。
# 名寄せ処理はこの節を読んではならない（同一視に使わないこと）。
relations_do_not_merge:
  - type: "containment"
    parent: "水源保全地域"
    child: "ダム集水域"
    basis: "cells.sqlite suigen_hozen_final_eval p.54 「県内水源保全地域の生活排水処理率 95.5% / うちダム集水域の生活排水処理率 74.1%」"
    note: "「うち」による包含。ダム集水域は水源保全地域の部分集合であって別名ではない。"
  - type: "disjoint"
    a: "水源の森林エリア"
    b: "地域水源林エリア"
    basis: "data/vocab/_p0p4_suigen_hozen.json 地域水源林エリアの定義文「…集水域のうち、水源の森林エリアを除いた区域」"
    note: "定義上互いに重ならない。同一視すると原文と矛盾する。"

