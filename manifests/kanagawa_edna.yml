# manifests/kanagawa_edna.yml（宣言。形は scripts/ingest/manifest.py の docstring）。
# 変換は scripts/adapters/kanagawa_edna.py（import は ingest.api と json だけ）。設計は docs/plans/KANAGAWA_EDNA.md。
source: kanagawa_edna
region: jp-14
target: occurrence
update_mode: snapshot          # 公表物を毎回丸ごと取り直す（m07 が wipe+reload）。年度が増えたら c89 の LAYOUTS を足して再実行
input:
  table: edna_detections
adapter: kanagawa_edna
expected_row_count: 13263
sample_input_max_rows: 13500   # 検出行 13,263 を全件サンプルに入れる（全体の上限 5,000 は動かさない）
checks:
  - not_null: [record_key, taxon_id]
  - unique: [record_key]
  - row_count_between: [13263, 13263]
  - in_registry: taxon
  - date_between: ["2021-04-01", "2026-03-31"]   # R7（2025 年度）の最後が 2026-03。年度は 4〜3 月なので year の形は使わない
evidence: >
  実測 2026-10-07: edna_detections 13,263 行（検出セルのみ。全行に採水日あり、座標ありは 5,154 行・座標なしは 8,109 行）。
  神奈川県ホームページ「環境ＤＮＡのページ」（https://www.pref.kanagawa.jp/docs/b4f/suigen/edna.html）を加工して作成。
  収集は scripts/c89_kanagawa_edna.py、原本の表は edna_sites / edna_reads / edna_detections（m07_kanagawa_edna.py）。
  occurrence には検出（リード数 > 0）だけを入れ、不検出は原本表に残す。値はリード数で個体数ではない。
  種の解決は registry/taxon/kanagawa_edna_name_map.csv（T1 392・T2 201・T2b 4・T3 367・T4 238・T5 272 名）。
  座標は公開データに無く、地点ごとの推定位置を精度つきで持つ（c89b の台帳で 87 地点に付き、判別不能は NULL）。
  同定の確度が低い行も全部入れ、確度は attributes に残す。
expected:
  period_shapes: {day: 13263}            # 採水日はすべて day の形。日付が空欄の行は無い
  place:
    coord_resolved: 5154                 # 座標がある行（実測）
    coord_unresolved: 0                  # grid01 に解決できない行。0 を保つ
  cube:
    dated_rows: 13263                    # 全行が日付あり
    dated_no_coordinate_rows: 8109       # 日付あり・座標なし（実測。13,263 − 5,154）
    leaf_cell_source_rows: 0             # leaf は年をまたぐ区間の記録。採水日（day）は 0
    leaf_cell_source_rows_no_coordinate: 0
    month_cell_source_rows: 5154         # 日付あり・座標あり（day は同一月に収まる）
    watershed_dated_resolved_rows: 5154  # 座標ありの行は全て流域に入る（coord_resolved と同数。流域一意で座標を付けた。b09 の突合で検証される）
    watershed_dated_unresolved_rows: 8109  # 座標なし
