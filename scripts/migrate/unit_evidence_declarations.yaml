# 単位の証拠検査（Issue #48 PR-1b §3.7、docs/plans/V2_SERVING_PR1.md）が読む宣言。
#
# `scripts/b04_build_cube.py` の `_assert_unit_evidence()` が `observation`
# （`unit_id IS NULL AND unit_raw IS NOT NULL` の行）を
# (source_table, variable_id, obs_stat, value_grain) 単位で集計し、ここに列挙した
# 系列の集合と**過不足なく**一致することを検証する:
#   - ここに無い新しい欠落が実データに現れたら止まる（宣言忘れ・回帰の検出）。
#   - 逆に、ここにある宣言が実データから消えたら止まる（解決済みの宣言を消し忘れて
#     いる——CLAUDE.md「宣言済み差分 > データを曲げる」の「宣言は列挙して機械検証する」
#     を、ここでは「宣言が腐ったら黙って見逃さない」という形で適用する）。
#
# D3（registry/variable_alias.csv、Issue #48 PR-1b）は「原本 measurements.unit
# （unit_raw）とレジストリの unit.symbol が一致した measurements データセットの
# alias 38行」だけを埋める、というオーナー決定の受け入れ条件どおりに実施した
# （流量の1alias だけは原本にも単位が無いため NULL のまま）。この結果:
#   - measurements データセットは `unit_id IS NULL AND unit_raw IS NOT NULL` の
#     行が 0 になった（流量の alias は unit_raw 自体が NULL なのでこの集合に
#     入らない）。
#   - sensor_timeseries データセットは D3 のスコープ外だったため、以前は
#     unit_id が NULL のまま原表記の単位を持つ1系列
#     （sensor_timeseries/common:variable:water.water_temp/instant、alias
#     "water_temperature"、source_id=synthetic_sensor）が未解決で残っていた。
#
# **Issue #48 PR-2 §1: b03 が既定で合成データ（is_synthetic=1）を除外する
# ようになったため、上記の未解決系列は該当行（11,652行、全て合成データ）が
# `observation` から一切消え、この宣言自体が「実データにもう存在しない
# （解決済みの）系列」の腐った宣言になった。CLAUDE.md「宣言済み差分 > データを
# 曲げる」に従い削除した——declared は空になる。**
#
# 診断専用の「v1互換キューブ」（合成データを含む observation）は、この系列がまた現れるため
# 別ファイルの宣言を使っていたが、Issue #48 PR-5 でその段ごと撤去した（b03 の
# `--include-synthetic` は診断用の単体オプションとして残っている）。
