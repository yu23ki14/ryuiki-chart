  # 年次集計（daily側）に1件ずつ追加され、n・avg・min が動く。
  - key: ["atsugi_river_water_quality__中津川", "浮遊物質量 SS", 2002, "daily"]
    kind: value_diff
    columns: [n, avg, min, n_censored]
    reason: >
