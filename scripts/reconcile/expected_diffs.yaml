# 宣言済み差分（scripts/b02_derived_compare.py の「宣言済み差分」機構が読む）。
# 形式・運用ルール（書ける形・reason に前後の数値を書かない理由・b02 が検証する
# 内容）は docs/plans/PHASE_B_RECONCILIATION.md §7「宣言済み差分」を参照
# （ここでは重複させない）。
#
# 各宣言のフィールド: key（ベースラインのキー列と同じ順・同じ個数）/ kind
# （row_only_in_candidate | row_only_in_baseline | value_diff）/ reason（原因の
# 説明のみ。前後の数値は書かない） / found_on（実測した日付）/ record（詳しい
# 経緯を書いた場所）。kind: value_diff の宣言だけ columns（食い違うと期待する
# 列名の集合。例: [n, avg, min]）も必須。
#
# 経緯（変更1）: `scripts/migrate/censoring.py` が『◯未満』（日本語表記の定量下限未満）を
# `unknown` ではなく `below_lod` に写すよう変更された。v1（web/scripts/build-derived.mjs）は
# `'◯未満'` の数値部分をパースできず `measurements.value` を NULL にしていたため
# （v1 側のバグ）、該当行は v1 の集計から静かに落ちていた。v2 はこれを below_lod として
# 0.0 を代入して拾うため、v1 が拾えていなかった行・集計値が新たに現れる／変わる。
# 該当は全12行、すべて `atsugi_river_water_quality__中津川`（variable: 浮遊物質量 SS）の
# `value_raw='1未満'` に由来する（`data/db/v2.sqlite` の `observation` を
# `WHERE censoring='below_lod' AND value_raw LIKE '%未満%'` で実測。2026-09-08）。
# 内訳: period_grain='day' が2行（2002-11-06 / 2003-10-07）、
# period_grain='fiscal_year' が10行（2005年度×2 / 2006年度×1 / 2007年度×1 /
# 2014年度×1 / 2016年度×1 / 2018年度×2 / 2020年度×2）。
# この12行が meas_daily 2件・meas_month 2件・meas_year 9件の差分として波及する
# （`--no-expected-diffs` で実測。3テーブル合計13件）。

meas_daily:
  # v1 は該当日が1件しか観測の無い site×variable×day のグループで、その唯一の
  # 観測が '1未満'（value=NULL）だったため、グループごと meas_daily から落ちていた。
  # v2 は below_lod として 0.0 を代入するため、n_raw=1 の日次セルが新規に現れる。
  - key: ["atsugi_river_water_quality__中津川", "浮遊物質量 SS", "2002-11-06"]
    kind: row_only_in_candidate
    reason: >
      v1 は value_raw='1未満' をパースできず value=NULL としたため、この日は
      site×variable×day の観測が1件しか無く、グループごと meas_daily から
      落ちていた（v1 のバグ）。v2 は below_lod として 0.0 を代入してこの観測を
      拾うため、meas_daily に日次セルが新規に現れる。
    found_on: 2026-09-08
    record: docs/plans/PHASE_B_RECONCILIATION.md 「再現できなかった箇所の記録」
  - key: ["atsugi_river_water_quality__中津川", "浮遊物質量 SS", "2003-10-07"]
    kind: row_only_in_candidate
    reason: >
      2002-11-06 と同じ理由（v1 が '1未満' をパースできず、観測が1件しか無い
      グループごと meas_daily から落としていた）。v2 は below_lod として 0.0 を
      代入してこの観測を拾うため、この日の日次セルが新規に現れる。
    found_on: 2026-09-08
    record: docs/plans/PHASE_B_RECONCILIATION.md 「再現できなかった箇所の記録」

meas_month:
  # meas_month は meas_daily から積み上げる（ADR-0011）。上の2つの新規日次セルは
  # それぞれ「その月で唯一の観測」でもあるため、月次セルとしても新規に現れる
  # （既存の月に1件追加されて平均が動く、ではなく、月ごと新規行になる）。
  - key: ["atsugi_river_water_quality__中津川", "浮遊物質量 SS", 2002, 11]
    kind: row_only_in_candidate
    reason: >
      meas_daily に新規に現れた 2002-11-06 のセルが、2002年11月で唯一の観測
      だったため、月次セル自体が meas_month に新規に現れる（meas_month は
      meas_daily から積み上げるため。ADR-0011）。
    found_on: 2026-09-08
    record: docs/plans/PHASE_B_RECONCILIATION.md 「再現できなかった箇所の記録」
  - key: ["atsugi_river_water_quality__中津川", "浮遊物質量 SS", 2003, 10]
    kind: row_only_in_candidate
    reason: >
      meas_daily に新規に現れた 2003-10-07 のセルが、2003年10月で唯一の観測
      だったため、月次セル自体が meas_month に新規に現れる（meas_month は
      meas_daily から積み上げるため。ADR-0011）。
    found_on: 2026-09-08
    record: docs/plans/PHASE_B_RECONCILIATION.md 「再現できなかった箇所の記録」

meas_year:
