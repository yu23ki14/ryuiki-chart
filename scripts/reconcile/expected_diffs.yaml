    record: docs/plans/PHASE_B_RECONCILIATION.md 「再現できなかった箇所の記録」
  - key: ["atsugi_river_water_quality__中津川", "浮遊物質量 SS", 2003, "daily"]
    kind: value_diff
    columns: [n, avg, min, n_censored]
    reason: >
