# 経緯（変更2・2026-09-15）: `measurements` 残り3テーブル（`meas_clim`/`site_var`/
# `var_catalog`）を b05（射影）に追加した拡張（PHASE_B_RECONCILIATION.md #6 参照）。
# `--no-expected-diffs` で実測した結果、新しい原因は無く、上と同じ12行
# （`atsugi_river_water_quality__中津川` の `浮遊物質量 SS`・`value_raw='1未満'`）が
# `meas_daily`/`meas_year` を経由して機械的に波及しただけだった（内訳は各テーブルの
# 節の直前コメント参照）。

meas_clim:
  # meas_daily に新規出現した2セル（上の meas_daily 宣言と同じ原因・同じ2行）が
  # 月別平年値（全地点・全出典をプールする、site_id を持たない集計）に1件ずつ
  # 混ざる。2002-11-06 は11月、2003-10-07 は10月の集計に入る。
  - key: ["浮遊物質量 SS", 10]
    kind: value_diff
    columns: [n, avg]
    reason: >
      meas_daily に新規出現した 2003-10-07 のセル（below_lod, value=0.0）が、
      10月の月別平年値（全地点・全出典をプールする、site_id を持たない集計）に
      1件追加され、n・avg が動く。
    found_on: 2026-09-15
    record: docs/plans/PHASE_B_RECONCILIATION.md 「再現できなかった箇所の記録」
  - key: ["浮遊物質量 SS", 11]
    kind: value_diff
    columns: [n, avg]
    reason: >
      meas_daily に新規出現した 2002-11-06 のセル（below_lod, value=0.0）が、
      11月の月別平年値（全地点・全出典をプールする、site_id を持たない集計）に
      1件追加され、n・avg が動く。
    found_on: 2026-09-15
    record: docs/plans/PHASE_B_RECONCILIATION.md 「再現できなかった箇所の記録」

site_var:
  # meas_year の kind='annual'/'daily' それぞれが、site_id, variable, kind 単位で
  # SUM(n)/AVG(avg) される。上の meas_year 宣言9件（annual 7件・daily 2件）の
  # 増分が、kind ごとにまとめて1行の差分として現れる。
  - key: ["atsugi_river_water_quality__中津川", "浮遊物質量 SS", "annual"]
    kind: value_diff
    columns: [n, avg]
    reason: >
      meas_year(kind='annual') の該当年度（上の meas_year 宣言のうち annual の
      各年）で below_lod の 0.0 代入行が増えるぶんが、site_var の annual 行
      （site_id, variable, kind 単位で meas_year を SUM(n)/AVG(avg) したもの）に
      反映され、n・avg が動く。
    found_on: 2026-09-15
    record: docs/plans/PHASE_B_RECONCILIATION.md 「再現できなかった箇所の記録」
  - key: ["atsugi_river_water_quality__中津川", "浮遊物質量 SS", "daily"]
    kind: value_diff
    columns: [n, avg]
    reason: >
      meas_year(kind='daily') の該当年（上の meas_year 宣言のうち daily の各年）
      で below_lod の 0.0 代入行が増えるぶんが、site_var の daily 行に反映され、
      n・avg が動く。
    found_on: 2026-09-15
    record: docs/plans/PHASE_B_RECONCILIATION.md 「再現できなかった箇所の記録」

var_catalog:
  # site_var の2行（annual/daily）ぶんの増分が、variable 単位（全地点合計）で
  # さらに集約される先。n_daily の +2 と n_annual の +10 の合計が n の +12 に
  # 一致することを実測で確認した。
  - key: ["浮遊物質量 SS"]
    kind: value_diff
    columns: [n, n_daily, n_annual, n_censored]
    reason: >
      上の site_var（annual・daily 両行）の増分が、variable 単位（全地点合計）で
      さらに集約される。below_lod の 0.0 代入行が増えたぶんが n・n_daily・
      n_annual・n_censored に反映される。
    found_on: 2026-09-15
    record: docs/plans/PHASE_B_RECONCILIATION.md 「再現できなかった箇所の記録」

# 経緯（変更3・2026-09-22）: O-1a（`occurrence`→`org_norm`、
# scripts/b06_build_occurrence.py・scripts/b08_project_occurrence_v1.py）で
# org_norm（816,856行）を実データで突合した結果、1行1列（cls）だけ再現できない
# taxon が見つかった。属単位の多数決（genus_match）が同数だった
# Sirosporium 属で、v1（web/scripts/build-biota.mjs、`ROW_NUMBER() OVER (...
# ORDER BY COUNT(*) DESC)`、同数時の順序は実装依存の暗黙順）は
# 'Sordariomycetes' を選んでいたが、taxon レジストリのビルダー
# （scripts/registry/build_taxon.py、`_majority_vote()`）は明示規則
# （件数降順・同数なら値の昇順）で 'Dothideomycetes' を選ぶ——どちらも
# 「正しい」多数決の結果であり、taxon_group（菌類）はどちらでも変わらない。
# 詳細は docs/plans/PHASE_B_OCCURRENCE.md §3「F2: 分類の補完」・
# scripts/registry/build_taxon.py の docstring。

org_norm:
  - key: ["gbif_kanagawa_occurrences__1829967465"]
    kind: value_diff
    columns: [cls]
    reason: >
      Sirosporium celtidis（GBIF taxon_key 由来、own class は NULL）。属
      Sirosporium の class 多数決が同数（Dothideomycetes と Sordariomycetes が
      同数）で、v1 は実装依存の暗黙順で 'Sordariomycetes' を選んでいたが、
      taxon レジストリは決定論的なタイブレーク（件数降順・同数なら値の昇順）で
      'Dothideomycetes' を選ぶ。taxon_group（菌類）は両候補とも同じなので
      変わらない。
    found_on: 2026-09-22
    record: "docs/plans/PHASE_B_OCCURRENCE.md §3「F2: 分類の補完」"

# 経緯（変更4・2026-09-22）: O-1b（`occurrence_agg`→年キー8表、
# scripts/b07_build_occurrence_cube.py・scripts/b08_project_occurrence_v1.py）で
# 年キー8表を実データで突合した結果、org_norm と全く同じ原因（Sirosporium属の
# class 多数決の同数タイブレーク）が species2.cls に1件だけ波及した（species2.cls
# は taxon.class の binom ごとの MAX() なので、taxon 単位の食い違いがそのまま
# 1行の食い違いとして現れる）。他の8表（org_group_year/effort_year/
# species_year2/species_month/mesh_year/mesh_all/mesh_species/species_mesh_year）
# は宣言なしで全数値列が完全一致した。

species2:
  - key: ["Sirosporium celtidis"]
    kind: value_diff
    columns: [cls]
    reason: >
      org_norm の宣言と同じ原因（属 Sirosporium の class 多数決が同数で、
      taxon レジストリの決定論的タイブレークが v1 の実装依存の暗黙順と食い違う）。
      species2.cls は MAX(taxon.class)（binom ごと）なので、taxon 単位の
      食い違いがそのまま1行の食い違いとして現れる。taxon_group（菌類）は
      両候補とも同じなので変わらない。
    found_on: 2026-09-22
    record: "docs/plans/PHASE_B_OCCURRENCE.md §3「F2: 分類の補完」"
