# scripts/b01_derived_baseline.py（common.py の derive_key）が使う宣言的なキー。
#
# derive_key() は次の順でキーを決める:
#   0. PRAGMA table_info の PRIMARY KEY 宣言（あれば最優先。SQLite が保証済み）
#   1. このファイルの宣言（あれば使う。自動探索より先に見る）
#   A. （0・1 が無ければ）宣言型を持つ列だけの部分集合を自動探索
#   B. （A で見つからなければ）A の全列 + 宣言型を持たない列を1個ずつ増やして自動探索
# A・B のどちらでも一意な組み合わせが見つからなかったテーブルは例外で止まる
# （このファイルに追記して解決する）。
#
# 現状（このファイルを最初に作った時点）: data/db/derived.sqlite の33テーブルは
# すべて自動導出（A/B）できたので、このファイルに実エントリは無い
# （docs/plans/PHASE_B_RECONCILIATION.md の「キー列の自動導出」参照）。
# 空でも読み込めること・宣言が優先されること・自動探索が本当に失敗したときは
# 例外で止まることをテストしている（scripts/tests/test_common.py）。
#
# 追記する場合の形式（コメントで「なぜ自動で決まらないか」を必ず1行残す）:
#
# some_table:
#   key: [col_a, col_b]
#   reason: "col_a・col_b を含めても全列を含めても一意にならない。
#            出典側に完全な重複行が n 件ある（原因は c99_xxx.py の重複取り込み）。
#            突合では重複行を許容し、キー衝突時は最初の行を代表とする。"
{}
