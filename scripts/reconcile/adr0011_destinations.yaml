# docs/adr/0011-aggregation-cube.md 「33テーブルの行き先」表をそのまま転記したデータ。
#
# scripts/b01_derived_baseline.py はこのファイルを読むだけで、どのテーブルが
# ADR-0011 のどの行き先（キューブ observation / キューブ occurrence / variable
# レジストリ / place の属性 / taxon / L2 ファクト本体 / document-cell 証跡層 /
# 書き込み系ログ）に対応するかを derived_baseline.md に併記する。テーブルごとの
# 分岐はコード側に書かない。
#
# 33テーブルの内訳（ADR-0011 表と一致することを scripts/tests で確認）:
#   12 + 11 + 1 + 2 + 3 + 1 + 2 + 1 = 33
#
# 2026-09-22 改訂（P-3、docs/plans/PHASE_B_DOCUMENTS.md）: doc_series/
# quality_monthly は cube_observation ではなかった（実際の入力は observation
# ではなく cells.sqlite/quality_transitions）。document_provenance/
# quality_workflow_log の2カテゴリを新設し、旧 doc_meta（doc_series_meta の
# みを持っていた）は document_provenance に吸収した。

cube_observation:
  label_ja: "キューブ（入力 observation）"
  tables:
    - meas_daily
    - meas_month
    - meas_year
    - meas_clim
    - zone_year
    - zone_clim
    - sensor_daily
    - sensor_hour_month
    - rain_daily
    - landuse_watershed
    - landuse_change
    - site_var

cube_occurrence:
  label_ja: "キューブ（入力 occurrence）"
  tables:
    - mesh_year
    - mesh_all
    - mesh_species
    - species_mesh_year
    - species_month
    - species_year2
    - species2
    - org_watershed
    - org_watershed_year
    - org_group_year
    - effort_year

variable_registry:
  label_ja: "variable レジストリ"
  tables:
    - var_catalog

place_attribute:
  label_ja: "place の属性"
  tables:
    - watershed_meta
    # watershed_rollup: D10型の結合射影（watershed_meta/org_watershed/site_var/
    # landuse_watershed の4表を組み合わせるだけで、独立したキューブのセルには
    # しない。docs/adr/0011-aggregation-cube.md 参照）。
    - watershed_rollup

taxon_registry:
  label_ja: "taxon / taxon_assessment（ADR-0019）"
  tables:
    - redlist_map
    - redlist_change
    - ias_species

fact_body:
  label_ja: "L2 のファクト本体に統合"
  tables:
    - org_norm

document_provenance:
  label_ja: "document/cell の証跡層からの射影"
  tables:
    - doc_series
    - doc_series_meta

quality_workflow_log:
  label_ja: "ADR-0017 書き込み系ログの射影"
  tables:
    - quality_monthly
