#
# 正解付けはモデル（Claude Sonnet 5.5）が 2026-11-24 に行った。人の確認はまだ。
#   - 質問は住民が聞きそうな言い方で書き、見出しはそのまま使っていない。
#   - 正解は articles.jsonl の本文を読んで、その質問に答えている記事を 1〜3 件付けた。
#     本文が PDF の段組みで崩れている記事が多く、正解の取りこぼしがありうる（recall は下振れしうる）。
#   - 人が直すときは gold を編集するだけでよい。eval.mjs はこのファイルだけを読む。
#   - article_id は m13 が決める（<doc_id>:<ページ3桁>:<見出しのハッシュ8桁>）。再抽出で変わったら、
#     title_hint（見出し。無い記事は null）と doc_id（号）で探し直す。
