# registry/source/license.yaml
#
# 出典のライセンス（ADR-0005）。scripts/registry/build_source.py が読み、registry.sqlite の
# `license` 表と、`source_edition.license_id`/`license_class`/`commercial_ok` を作る。
#
# 手書きの正。元の自由記述（ryuiki.sqlite `source_registry.license`、71 種）を **原文の
# まま** `mappings[].raw` に置き、`license_id` へ写す。原文は `source_edition.license_raw`
# にも残る（写像で情報を捨てない）。
#
# **これは分類であって許諾の判断ではない。** ADR-0005 改定（Issue #39 Phase C）のとおり、
# `redistributable`/`license_class`/`commercial_ok` は出典の旗として残すだけで、出力・API・
# DwC-A を絞る根拠にしない（扱うデータは全て公開済み。ADR-0028・オーナー決定）。
# 「隔離」は行わず、`embargo_reason` 列も作らない。
#
# 写像漏れ: source_registry に、ここの `mappings[].raw` に無い原文があると `unknown` に
# 落とし、件数と原文をビルドの出力に出す（黙って埋めない。止めもしない）。逆に、
# source_registry に無い原文を `mappings` に書いておくとビルドが止まる（古い宣言の掃除）。
# `unknown` に落ちた件数が 0 であることは scripts/tests/test_registry_source.py が
# 実データで確認する（原本があるときだけ）。

# license_class のコードリスト。commercial_ok は edition の列に写す値（NULL = 判定しない）。
# organism_records.license_class（open/noncommercial/restricted/unknown）は別の語彙で、
# 行単位のライセンス（DwC-A 用）。ここは出典（edition）単位。
license_classes:
  public_domain: {commercial_ok: 1, description: "パブリック・ドメイン（CC0 等）"}
  cc_by: {commercial_ok: 1, description: "CC BY（表示）"}
  share_alike: {commercial_ok: 1, description: "継承条件あり（ODbL 等）"}
  open_terms: {commercial_ok: 1, description: "出典明示で利用可（政府標準利用規約・PDL・各サイトポリシー等）"}
  noncommercial: {commercial_ok: 0, description: "非商用のみ"}
  custom_terms: {commercial_ok: null, description: "出典独自の規約。商用可否は規約を読む"}
  restricted: {commercial_ok: 0, description: "複製・転用不可"}
  mixed: {commercial_ok: null, description: "行・データセットごとに異なる"}
  unconfirmed: {commercial_ok: null, description: "未確認"}
  unknown: {commercial_ok: null, description: "未分類"}

licenses:
  - license_id: cc0_1_0
    name_ja: "CC0 1.0 全世界パブリック・ドメイン提供"
    spdx_or_url: "https://creativecommons.org/publicdomain/zero/1.0/"
    license_class: public_domain
    attribution_text: null
    notes: "合成データ（自プロジェクト生成）と、さがみはらデジタルアーカイブの目録情報。"
  - license_id: cc_by
    name_ja: "クリエイティブ・コモンズ 表示（CC BY）"
    spdx_or_url: "https://creativecommons.org/licenses/by/4.0/"
    license_class: cc_by
    attribution_text: "出典（提供元・データセット名）を表示する"
    notes: "表記ゆれ（CC-BY 4.0 / Creative Commons Attribution / クリエイティブ・コモンズ-表示）をまとめた。版（4.0）の明記が無い原文も含む（原文は license_raw に残す）。"
  - license_id: odbl_1_0
    name_ja: "Open Database License 1.0（ODbL）"
    spdx_or_url: "https://opendatacommons.org/licenses/odbl/1-0/"
