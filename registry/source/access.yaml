# 出典ごとの「ツールで値が取れるか」の宣言（docs/plans/MCP_SOURCE_ACCESS.md §1）。人が書く正。
#
# - manifests/ にある出典（24 件。target=observation → get_observations、occurrence → get_occurrences）は
#   ここに書かない（二重管理しない）。ただし get_records でも取れる表があれば records だけ足す。
#   get_edna のような追加のツールは extra_tools に書く。
# - catalog: find_datasets で取れる（外部ポータルの目録 external_dataset に出典の行がある。records/reason と排他）。
#   n_source_rows は目録の件数（データセット数）で、値の行数ではない。
# - records: get_records で取れる record_set（下の record_sets の名前）。表は出典の列 source_id で絞る。
# - reason: 取れない理由（reasons の語彙）。basis は下書きの根拠（source_registry の列・data/processed の有無から
#   機械的に決めたもの）で、必須。note は人が読む補足（任意）。
# - r01 が、全出典が状態を持つこと・records の表に行があること・reason の出典に行が無いこと
#   （synthetic だけ例外）を原本と突き合わせて検査する。scripts/registry/build_source_access.py の docstring 参照。
# record_sets: get_records の引数 record_set の値 → D1 の表。**この対応の正はここ 1 か所**（生成物 RECORD_SET_TABLES を
# web/src/lib/records.ts が読む）。D1 にある表だけ書く（原本にだけある表は reason: not_in_d1）。
record_sets:
  sites: place   # place_kind='site'（key_space=site_id）。出典は place_source_ref.source_edition_id → source_edition.source_id
  protected_areas: protected_areas
  vegetation: vegetation_polygons
  river_segments: river_segments
  mammal_mesh: mammal_mesh
  sightings: wildlife_sightings
  assessments: taxon_assessment
  hazard_zones: hazard_zones
reasons:
  not_collected: {ja: "未収集（取得手段が未着手、または登録のみ）"}
  blocked_access: {ja: "ログイン・APIキー・利用アンケート・JS 画面などで、自動取得できていない"}
  document_cells: {ja: "行政文書の表として cells に入れてある（出典の列は無い）。/documents・run_sql・get_records の record_set=documents で読む"}
  pdf_document: {ja: "PDF の文書のまま。表として取り出していない"}
  map_service: {ja: "地図サービス（WebGIS）。値は外部サービス側にある"}
  external_api: {ja: "外部 API・CGI・現況ページ。値は提供元に問い合わせる"}
  catalog_only: {ja: "データ目録（メタデータ）で、観測値・記録そのものではない"}
  license: {ja: "利用条件が不明のため取得していない"}
  file_only: {ja: "収集済みだが D1 に投入していない（data/processed のファイルのみ）"}
  superseded: {ja: "別の出典に置き換わった（superseded_by 参照）"}
  synthetic: {ja: "合成データ。実データと混ぜないため出さない"}
  d1_no_source_column: {ja: "D1 の表に出典の列が無く、表の行をどの出典のものか機械的に引けない"}
  not_in_d1: {ja: "原本には行があるが、D1 にその表が無い（本番では引けない）"}
