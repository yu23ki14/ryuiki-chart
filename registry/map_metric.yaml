# registry/map_metric.yaml
#
# 地図ページ（web/src/components/map/MapPage.tsx）の「流域の塗り分け指標」と「生物メッシュの指標」の
# 表示語彙（ラベル・説明文・単位）。以前は MapPage.tsx に直書きされていた。
#
# unit.yaml には入れない: unit.yaml は measurements / sensor_timeseries の測定単位の語彙で、
# ここで要る「件/km²」「地点」「件」のような件数系の表示単位は無い（unit.yaml の「点」は
# 別物）。なので表示用の短い文字列 unit_ja をここに持つ。単位の無い指標は unit_ja を省く。
# 出典名は note_ja の文中に書く（流域の土地利用増減は 国土数値情報 土地利用細分メッシュ）。
#
# 振る舞い（発散配色にするか、土地利用の年を注記に付けるか）はコード側（MapPage.tsx）が
# id で持つ。語彙ではなく描画の仕様なので。
#
# web/scripts/build-registry-ts.mjs が zone.yaml と同じくこのファイルを直接読んで
# generated-client.ts の MAP_METRICS を作る（registry.sqlite は経由しない）。
# scope: watershed（流域の塗り分け）| mesh（生物メッシュ）。表示順はファイルの順。

- scope: watershed
  id: org_density
  label_ja: 生物記録の密度
  note_ja: 流域の面積あたりの観察・標本記録数（件/km²）
  unit_ja: 件/km²
- scope: watershed
  id: site_n
  label_ja: 観測地点の数
  note_ja: その流域にある水質・気象などの観測地点
  unit_ja: 地点
- scope: watershed
  id: org_redlist_n
  label_ja: レッドリスト種の記録数
  note_ja: レッドリストのカテゴリーが付いた観察記録
  unit_ja: 件
- scope: watershed
  id: built_delta
  label_ja: 市街地の増減
  note_ja: 国土数値情報 土地利用細分メッシュ。建物用地の面積の差
  unit_ja: km²
- scope: watershed
  id: forest_delta
  label_ja: 森林の増減
  note_ja: 同上・森林の面積の差
  unit_ja: km²
- scope: watershed
  id: paddy_delta
  label_ja: 田の増減
  note_ja: 同上・田の面積の差
  unit_ja: km²
- scope: mesh
  id: "n"
  label_ja: 記録の件数
  note_ja: 同じ場所で何度も記録されると大きくなる
- scope: mesh
  id: species_n
  label_ja: 確認された種数
  note_ja: 件数が多くても種数が少ない場所がある
- scope: mesh
  id: rl_n
  label_ja: レッドリスト種の記録数
  note_ja: 保全上の重要地点を探す
