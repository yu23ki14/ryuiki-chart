# v1（web/scripts/build-biota.mjs の ias_species、234-257行）が二名法(binom)の
# 誤ヒットを防ぐためにハードコードしていた7種の除外を宣言化したもの
# （P-2 オーナー決定A。「宣言済み差分 > データを曲げる」——除外は消して忘れる
# のではなく、理由つきで残す）。scripts/b08_project_occurrence_v1.py の
# ias_species 射影がこれを読み、list_id='moe_ias_2015' の外来種リストで
# v1 と同じ7種の binom を除外する（org_norm.binom と一致する行を除く）。
#
# 除外の理由は2種類あり、重なる種がある（下記 reasons は1件で複数持ちうる）:
#
# - domestic_origin: moe_ias_list.csv の origin_ja が「国内由来の外来種」を含む。
#   国内の別地域個体群（例: 奥尻島・屋久島のタヌキ）が、掲載学名の二名法(binom)
#   だけで結合すると、神奈川県内在来個体群の記録（同じ学名の別亜種/別個体群）に
#   まで誤ヒットする。
# - subspecies_binomial_contraction: moe_ias_list.csv の掲載学名が亜種（3語）で、
#   二名法（先頭2語への縮約）を取ると、掲載されていない別亜種（神奈川県内の在来
#   個体群を含む）にも誤ヒットする。Apis mellifera（掲載学名 Apis mellifera
#   scutellata、origin_ja は「国外由来の外来種」——domestic_origin では
#   説明できない）はこちらのみ該当する。
#
# 実測: reasons に domestic_origin を含む行 6件・subspecies_binomial_contraction
# を含む行 2件（Trypoxylus dichotomus は両方に該当するため、distinct 種は
# 6+2-1=7件。scripts/registry/build_taxon_assessment.py がこの実測件数を
# ビルド時に検証する）。
#
# Issue #34（2026-10）: 出典の属性による規則 `rules:` を足した。全国リストの
# 「国内由来」は地域によって在来であり、神奈川で外来かを全国リストは判定できない
# ——n_alien（外来種として数える記録）は「国外由来の掲載がある種」に限る。
# 下の `exclusions:`（v1 互換の固定7種）は併用して残す: 6種は規則にも含まれる
# （宣言と規則の整合はビルドが機械検証する）、Apis mellifera だけは規則に含まれず
# （origin_ja は国外由来）この宣言が唯一の根拠。
# ADR-0019「Issue #34: 外来種の除外規則」・reports/phase_b_taxon_assessment.md 参照。
rules:
  # list_id の行を binom（二名法）ごとに束ね、その binom の**すべての掲載**が「国内由来のみ」
  # のとき除外する（理由コード domestic_origin）。種名はここにもコードにも書かない。
  # 掲載1件の origin_ja の分類（build_taxon_assessment.py `_origin_class()`）:
  #   - 空: unknown（出典が由来を持たない。1件でもあればその binom は除外しない＝推測で除外しない）
  #   - foreign_marker_ignore の語句を取り除いた残りに foreign_marker を含む: foreign（国外由来の掲載）
  #   - それ以外で domestic_marker を含む: domestic（国内由来のみ）
  # 「国内由来の外来種、国内に自然分布域を持つ国外由来の外来種」の「国外由来」は、国内に自然分布域を持つ
  # ものの注記であり国外由来の掲載ではないので foreign_marker_ignore で取り除く（取り除かないと
  # 国内由来の併記がすべて「国外由来を含む」ことになり、規則が1件も効かない）。
  # 同じ binom に国外由来の掲載が1件でもあれば除外しない（Sus scrofa など）。
  # 「国内に自然分布域を持つ国外由来」も国内に在来の分布があるので、神奈川で外来かを全国リストは決められない——
  # 同じ理由で除外側に倒す（Issue #34 オーナー承認。規則と n_alien の定義は 2026-10-07 オーナー確認済み）。
  - rule_id: domestic_origin_only
    list_id: moe_ias_2015
    domestic_marker: "国内由来"
    foreign_marker: "国外由来"
    foreign_marker_ignore:
      - "国内に自然分布域を持つ国外由来の外来種"
    reason: domestic_origin
    # build() の本番経路が実測と突き合わせる（moe_ias_list.csv の更新で変わったら止まる）。
    expected_binom_count: 27
    # origin_ja が取りうる値（未知の値が増えたら止まる。語句一致の取りこぼし防止）。
    known_origin_values:
      - "国外由来の外来種"
      - "国内由来の外来種、国内に自然分布域を持つ国外由来の外来種"
      - "国内由来の外来種・国内に自然分布域を持つ国外由来の外来種"

exclusions:
  - list_id: moe_ias_2015
    scientific_name: "Nyctereutes procyonoides"
    vernacular_name_ja: "奥尻島・屋久島のタヌキ"
    reasons: [domestic_origin]
  - list_id: moe_ias_2015
    scientific_name: "Plantago asiatica"
    vernacular_name_ja: "高山帯のオオバコ"
    reasons: [domestic_origin]
  - list_id: moe_ias_2015
    scientific_name: "Trypoxylus dichotomus"
    vernacular_name_ja: "北海道・沖縄のカブトムシ本土亜種"
    reasons: [domestic_origin, subspecies_binomial_contraction]
    note: "掲載学名は亜種 Trypoxylus dichotomus septentrionalis"
  - list_id: moe_ias_2015
    scientific_name: "Morus australis"
    vernacular_name_ja: "小笠原諸島などのシマグワ"
    reasons: [domestic_origin]
  - list_id: moe_ias_2015
    scientific_name: "Apis mellifera"
    vernacular_name_ja: "アフリカミツバチとアフリカ化ミツバチ"
    reasons: [subspecies_binomial_contraction]
    note: "掲載学名は亜種 Apis mellifera scutellata。origin_ja は「国外由来の外来種」（domestic_origin では説明できない）。rules: の domestic_origin_only に含まれないため、この固定宣言を残す（唯一の根拠）"
  - list_id: moe_ias_2015
    scientific_name: "Cervus nippon"
    vernacular_name_ja: "新島などのニホンジカ"
    reasons: [domestic_origin]
  - list_id: moe_ias_2015
    scientific_name: "Rumex japonicus"
    vernacular_name_ja: "山地のギシギシ"
    reasons: [domestic_origin]
