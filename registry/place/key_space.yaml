# place_source_ref.key_space の宣言（ADR-0006、Issue #39 Phase C）。
#
# place_source_ref の旧 `source_id` 列は出典ではなく「外部キーの空間」（v1 の `表.列`）だった。
# 列名を key_space に改め、値を下の4つに写した。出典（どの版のデータか）は別列
# `source_edition_id`（NULL 可）が持つ。
#
# 旧 `place_source_ref.source_id` の値との対応（列値の改称。`id_map` と違い ID の改称ではない。
#   どこからも読まないので宣言ではなくここに記録する）: site_id=sites.site_id / zone=sites.zone /
#   watershed_id=watershed_meta.watershed_id / grid01_latlon=organism_records.lat_lon。
# place_kind: この key_space を持つ place の種類（build_place.py が出力と照合する。食い違えば止まる）。
# edition: source_edition_id の埋め方。
#   per_row_prefix = site_id の接頭辞（`<source>__`）から行ごとに引く / fixed = 1つの
#   出典に固定 / none = 出典を持たない（理由は edition_note）。
#   source_edition_id は build_place.py がこの宣言から埋める（`source_edition` 表に実在する版だけ。
#   per_row_prefix は接頭辞の出典、fixed は edition_source_id の出典が持つ唯一の版。実在しなければ止まる）。
key_spaces:
  - key_space: site_id
    place_kind: site
    edition: per_row_prefix
    edition_note: site_id が `<source>__<code>` の形なので接頭辞から出典が引ける。
  - key_space: zone
    place_kind: zone
    edition: none
    edition_note: Ridge to Reef ゾーンは本プロジェクト自前の操作的区分（registry/place/zone.yaml）で、外部の出典を持たない。
  - key_space: watershed_id
    place_kind: watershed
    edition: fixed
    edition_source_id: nlni_w12_watersheds   # 既定。地域ごとの W12（nlni_w12_watersheds_amami 等）は build_place が jsonl の名前で行ごとに引く
    edition_note: data/processed/nlni_w12_watersheds.jsonl（国土数値情報 W12 流域界 1977年版）。
  - key_space: grid01_latlon
    place_kind: grid01
    edition: none
    edition_note: 0.01度グリッドは organism_records の座標から機械的に作った集計単位で、出典を持たない。
