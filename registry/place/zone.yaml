# registry/place/zone.yaml
#
# zone（Ridge to Reef 1-5）の操作的定義 v2（definition_version: 2。docs/plans/AMAMI_STEP0.md §1、
# ADR-0031）。神奈川・奄美で共通の定義。標高・海岸線距離・地形の起伏から機械的に付けた
# 操作的区分であり、公式の行政区分・学術区分ではない。閾値は仮置きで、水野研レビュー等で
# 確定する必要がある（docs/ZONE_DEFINITION.md の「限界」を参照）。
#
# 構造:
#   definition_version  定義の版。place.definition_ref / place_relation.basis に残る。
#   note_ja             地域共通の注記（画面・caveat から引ける文）。
#   terrain:            指標の定義パラメータ。変えたら scripts/c68_gsi_dem_terrain.py を回し直す
#                       （terrain_points.csv の params_digest が合わなければビルドが止まる）。
#   rule:               判定の閾値。変えても c68 は回し直さない。classify() は
#                       scripts/registry/zone_rule.py。
#   zones:              5件。condition_ja は definition_ref の一文用、ui_condition_ja は画面・AI 用の
#                       短い表記。数値を直すときは rule: と両方の文言を手で揃える
#                       （揃っているかは scripts/tests/test_zone_rule.py が検査する）。
#
# web/scripts/build-registry-ts.mjs は zones: を直接読んで（registry.sqlite を経由せず）
# generated-client.ts の ZONE_INFO を作る（zone・name_ja を zone/label に、ui_condition_ja を
# cond に使う）。js-yaml でも読めるよう、一般機能は block 形式のマップ・リストだけに留める。

definition_version: 2

note_ja: zone は地形から機械的に付けた操作的区分で、公式の区分ではない。標高の低い島（奄美大島など）では山地（zone 2）が陸の大半を占め、低地（zone 4）はほとんど現れない。これは定義の結果で、凡例・名称は地域によらず共通である。

terrain:
  dem_tile_zoom: 14
  floor_dem_tile_zoom: 12
  relief_wide_radius_m: 1000
  relief_near_radius_m: 250
  lowland_floor_radius_m: 2000

rule:
  coast_dist_max_m: 2000
  coast_elev_max_m: 10
  mountain_relief_min_m: 200
  summit_ratio_min: 0.5
  lowland_elev_max_m: 100
  lowland_relief_max_m: 30
  lowland_above_floor_max_m: 15

zones:
  - zone: 1
    name_ja: 山地源流域
    condition_ja: 山地（周囲1kmの起伏量200m以上）で、標高が地域の最高峰の半分以上
    ui_condition_ja: 山地（周囲1kmの起伏量200m以上）で、標高が地域の最高峰の半分以上
  - zone: 2
    name_ja: 山地渓流
    condition_ja: 山地（周囲1kmの起伏量200m以上）で、標高が地域の最高峰の半分未満
    ui_condition_ja: 山地（周囲1kmの起伏量200m以上）で、標高が地域の最高峰の半分未満
  - zone: 3
    name_ja: 丘陵・台地・扇状地
    condition_ja: 山地でも低地でもない場所
    ui_condition_ja: 山地でも低地でもない場所
  - zone: 4
    name_ja: 平野・沖積低地
    condition_ja: 標高100m以下、周囲250mの起伏量30m以下、周囲2kmの最低点から15m以内（山地でも沿岸でもない）
    ui_condition_ja: 標高100m以下・周囲250mの起伏量30m以下・周囲2kmの最低点から15m以内（山地でも沿岸でもない）
  - zone: 5
    name_ja: 河口・沿岸
    condition_ja: 海岸から2km以内かつ標高10m以下
    ui_condition_ja: 海岸から2km以内かつ標高10m以下
