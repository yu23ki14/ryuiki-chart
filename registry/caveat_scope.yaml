# 注記（registry/caveat.yaml）がどの範囲に掛かるか（caveat_scope の宣言。Issue #35）。
# 以前は scripts/registry/build_caveat.py の Python 定数だった。build_caveat.py はこのファイルを
# 読んで検査し、caveat_scope に書くだけ。語彙の根拠は docs/adr/0013-caveats.md
# 「scope の語彙（2026-10-06 追記）」。
#
# scope_kind は ADR-0013 の6種。scope_ref は ID そのもの、または `キー=値`（`&` で連結）の選択式。
# 実行時の照合は文字列の完全一致で、選択式は解釈しない（web/src/lib/cube/caveats.ts の
# facetsForSeries 等が同じ文字列を作る）。selectors に無いキーは build_caveat.py が止める。
#
# 並び: sort_order は「同じ (kind, ref) の中での宣言順」。priority は大きいほど先頭
# （synthetic だけ 1）。
#
# cells.notes 由来の注記の scope はここに書かない（build_caveat.py が cells.sqlite から導出する。
# source_edition の `doc_id=<doc_id>`、observation_set の `doc_table=<doc_id>#<table_id>`）。

vocabulary: [variable, place, source_edition, observation_set, dataset, taxon]

# kind ごとに許す選択式のキー。ID 参照を許す kind は id_ok: true
# （variable は variable.yaml の variable_id、dataset は論理データセット名）。
selectors:
  variable: {id_ok: true, keys: [theme]}
  place: {id_ok: false, keys: [place_kind]}
  source_edition: {id_ok: false, keys: [source_id, doc_id]}
  observation_set: {id_ok: false, keys: [is_synthetic, variable, unit_id, doc_table]}
  dataset: {id_ok: true, keys: []}
  taxon: {id_ok: false, keys: []}  # 未使用。使うときに実在の検証を足してから id_ok にする

# 値が閉じた集合のもの（実在の値。build_caveat.py が scope_ref の値と照合し、無ければ止める）。
# variable_id・theme は registry/variable.yaml、doc_id・doc_table は cells.notes から検証するので
# ここには書かない。place_kind は place.place_kind、source_id は taxon_assessment.source_id と manifests/<source_id>.yml のある出典、
# dataset は variable_alias.csv の dataset 列＋配信表 sites。
values:
  place_kind: [site, zone, grid01, watershed]
  # 奄美の 3 件はマニフェスト（manifests/）が入るまでここで実在を宣言する（入ったら二重だが無害）
  source_id: [moe_ias_list, gbif_kanagawa_occurrences, inaturalist_kanagawa, kanagawa_kuma_sightings,
              gbif_amami_occurrences, inaturalist_amami, nlni_l03b_landuse_by_watershed_amami]
  dataset: [measurements, sites]

scopes:
  # 配信表 sites（地点台帳）を dataset として扱う（v1 の表名で引く経路は廃止）。
  - {kind: dataset, ref: sites, caveats: [zone, municipality]}
  # zone は地点（site）にも流域集計（zone）にも掛かる。municipality は地点固有。
  - {kind: place, ref: place_kind=site, caveats: [zone, municipality]}
  - {kind: place, ref: place_kind=zone, caveats: [zone]}

  - {kind: dataset, ref: measurements, caveats: [measuredOn, censoredLod, duplicates]}
  # 定量上限超えの26行は全て透明度（Issue #35 レビューで dataset 全体から狭めた）。
  - {kind: variable, ref: "common:variable:water.transparency", caveats: [aboveLod]}
  # 感潮域の逆流。以前は hydro.flow の description_ja への埋め込み。
  - {kind: variable, ref: "common:variable:hydro.flow", caveats: [flowTidalBackflow]}
  # 単位が付かない系列。対象の variable は registry/variable_alias.csv の unit_id が空の行から
  # build_caveat.py が機械的に導出する（ref_template の {variable_id} に代入）。
  # 流量の unit_id は #31 で variable_alias.csv に入るので、この導出から自動で外れる。
  - {kind: observation_set, ref_from: unit_unknown_variables, ref_template: "variable={variable_id}&unit_id=null", caveats: [unitUnknown]}

  # 出現記録の注記は、関係する出典の facet に付ける（dataset 全体には付けない。結果に含まれない出典の注記を出さないため）。
  # 本文に照らした対応: organismSite は本文の件数・「原本で全件 NULL」が GBIF・iNat の記録（organism_records）のものなので
  # GBIF と iNat だけ。effort は GBIF・iNat だけ（本文が記録者列の数値を含む）。eDNA・クマ目撃の努力の注記は effortSurvey（オーナー確認 2026-10-07）。ednaWatershed は eDNA だけ。
  # regimes は標本・eBird・iNat の年代の入れ替わりなので GBIF と iNat。gbifCutoff は GBIF 側の途切れなので GBIF だけ。
  - {kind: source_edition, ref: source_id=gbif_kanagawa_occurrences, caveats: [organismSite, effort, regimes, gbifCutoff]}
  - {kind: source_edition, ref: source_id=inaturalist_kanagawa, caveats: [organismSite, effort, regimes]}
  - {kind: source_edition, ref: source_id=kanagawa_kuma_sightings, caveats: [effortSurvey]}
  # 神奈川県 eDNA（source_id=kanagawa_edna の採水）。結果の出典に kanagawa_edna を含む tool に、source facet で掛かる。
  - {kind: source_edition, ref: source_id=kanagawa_edna, caveats: [ednaReads, ednaCoords, ednaYearBasis, ednaNonDetect, ednaWatershed, effortSurvey]}
  # share は割合（‰）で比べる画面（grid01 の種別トレンド）だけに掛かる。流域の表は生の件数。件数を返す MCP は引かない。
  - {kind: place, ref: place_kind=grid01, caveats: [share]}
  - {kind: source_edition, ref: source_id=moe_ias_list, caveats: [isAlien]}
  # 奄美（決定6・7）。出現記録の赤リストの意味の違いは GBIF・iNat、W12 が覆わない部分は流域別に集計する 3 出典（出現 2 + 土地利用）。
  # 神奈川の GBIF・iNat に付く注記のうち、effort（観察努力。件数の増加を実体の増加と読ませない）は奄美にも当てはまるので付ける。
  # 付けないもの: organismSite（本文の割り当てできない約10%・83,515件は神奈川の実数。奄美の同じ趣旨は amamiWatershedGap が担う）、
  # regimes（2013–16 標本・2017–24 eBird・2025 以降 iNat という年代の入れ替わりは神奈川の GBIF の実測。奄美では未確認）、
  # gbifCutoff（2024年12月の途切れは神奈川分の GBIF 取り込みの実測。奄美では未確認）。確認できたら奄美用の注記を別に起こす。
  - {kind: source_edition, ref: source_id=gbif_amami_occurrences, caveats: [effort, amamiRedList, amamiWatershedGap]}
  - {kind: source_edition, ref: source_id=inaturalist_amami, caveats: [effort, amamiRedList, amamiWatershedGap]}
  - {kind: source_edition, ref: source_id=nlni_l03b_landuse_by_watershed_amami, caveats: [amamiWatershedGap]}
  # 土地利用の定義変更は、本文が名指しする3区分（幹線交通用地・道路・鉄道）だけが影響を受けるが、
  # 他の10区分は日本語名が一致するだけで定義の一致は確認できていないので、指標全体（theme）に掛ける
  # （推測で狭めない。docs/plans/ISSUE35_CAVEAT.md §7-3）。
  - {kind: variable, ref: theme=landuse, caveats: [landuseDefinitionChange]}
  # 合成データ（is_synthetic=1）。現行の配信経路には載らない休眠の注記。先頭に出す。
  - {kind: observation_set, ref: is_synthetic=1, priority: 1, caveats: [synthetic]}

# どの範囲にも自動では付けない注記（画面が caveatBody で直接引くもの。AI のプロンプトには全注記が
# 入る）。意図して付けないことを宣言する（宣言漏れと区別するため。build_caveat.py が、ここと
# scopes の両方に載る・どちらにも載らない注記を止める）。
unscoped: [fishClass, inatBackfill]
