# 注意事項（caveat）レジストリ（docs/plans/PHASE_A.md §A-5, docs/adr/0013-caveats.md）。
#
# 現行の注記14件をそのまま移したもの:
#   - web/src/lib/domain.ts の DATA_CAVEATS（7件）: measuredOn censored（のち censoredLod に一本化）duplicates
#     zone organismSite effort synthetic
#   - web/src/lib/domain.ts の BIOTA_CAVEATS（6件）: regimes gbifCutoff share
#     inatBackfill fishClass isAlien
#   - web/src/lib/ai/caveats.ts に直書きの municipality（1件）。
#     MUNICIPALITY_LABEL（"水域・地域"）を埋め込んだ本文を、現行と完全に同じ文字列で複製している。
#
# body_ja は1文字も変えていない（web/src/lib/ai/caveats.test.ts の34ケースとの一致で検証済み。
# 検証手順は scripts/registry/build_caveat.py の docstring を参照）。
# 新しい注記はここに足していない（PHASE_A.md §A-5 の4）。
#
# caveat_id は common:caveat:<key>（scripts/registry/common.py の caveat_id()）。
# この yaml では key だけを書き、caveat_id はビルド時に導出する。
#
# severity / kind の付け方（build_caveat.py にも同じ説明あり）:
#   - severity='blocking' は、本文が「てはいけない」「読まないこと」「はできない」
#     「意味がない」「信頼できない」など明示的な禁止・否定表現を含むものだけに限定した。
#     それ以外は severity を null のままにしている（推測で厳格化しない）。
#   - kind は docs/adr/0013-caveats.md の enum
#     （time_series_break/unit_change/method_change/definition_change/censoring/
#     coverage_gap/synthetic/embargo/known_error）に文言がほぼそのまま対応するものだけ付けた。
#     無理に当てはめず、決められないものは null のままにしている。
#   - title_ja / quote は元が手書きの説明文（原本からの引用ではない）なので null のまま。
#     引用（quote）を持つのは cells.notes 由来の caveat（build_caveat.py が別途生成、
#     この yaml には含まれない）。
#
# caveat_scope（テーブル→注記のマッピング）はこの yaml には含まない。
# scripts/registry/build_caveat.py がテーブル名の集合をコードに埋め込んで caveat_scope に書く
# （マッピング自体は web/src/lib/ai/caveats.ts の SITES_CAVEATS 等の再現であり、
# データというよりロジックの複製にあたるため。理由は build_caveat.py の docstring）。
#
# landuseDefinitionChange（P-1b、docs/plans/PHASE_B_LANDUSE.md）・censoredLod・unitUnknown
# （Issue #48 PR-2）・aboveLod（ADR-0009 決定4-C）は Phase A 以降に新規に足した注記
# （上記「新しい注記はここに足していない」への例外）。
#
# **v1 の table 行は撤去済み（Issue #48 PR-5）。** v1 の派生表・原本表が D1 から DROP
# されたので、caveat_scope の 'table'/'table_prefix' 行は `sites`（zone/municipality）だけ
# になった。v2 は facet（dataset/place_kind/source_id/variable_theme/variable）で引く。
# scope は scripts/registry/build_caveat.py にある（yaml には含めない）。
#
# `censored`（旧: 定量下限未満を 0 とみなす、zero 系列を名指し）は撤去し、画面の値
# （lod 系列）に合う `censoredLod` に一本化した（ADR-0009 の2026-09-24追記の申し送りの
# 解消。同じ意味の2キーを残すと再発するため）。ホームの注記（web/src/app/page.tsx）も
# `censoredLod`。severity='blocking' は「とは読まないこと」という禁止表現を含むため
# （build_caveat.py 冒頭の severity 判定ルールに従う）。
#
# unitUnknown: scope kind `variable` の最初の消費者。refs（対象 variable_id）は
# registry/variable_alias.csv の unit_id が空の行から build_caveat.py が機械的に導出する
# （ハードコードしない）。severity='blocking' は「混同しないこと」という禁止表現を含むため。
# kind は ADR-0013 の enum のどれにも無理に当てはまらないため null のまま。
#
# aboveLod: `water.transparency`（透明度）の定量上限超え（`>1.4`〜`>28`、26行）は
# `value_zero`/`value_lod` のどちらの列も作らない（`n`/`n_censored` を含むあらゆる集計から
# 丸ごと落ちる——ADR-0009 決定4-C）。列を作らない代わりに注記で伝える。scope は
# `censoredLod` と同じ dataset='measurements'。
#
# ## レビュー記録（Issue #35、2026-10-06）
# 全注記に `review:` を持たせた（docs/plans/ISSUE35_CAVEAT.md §3。判定基準は
# docs/adr/0013-caveats.md の「severity/kind の判定基準」）。reviewer は
# 「claude（オーナー委任）」。オーナーは 2026-10-07 に全18件の severity/kind を
# 変更なしで確認済み（review.owner_confirmed_on）。
#   review.reviewed_on / reviewer / owner_confirmed_on / reason（判断理由1〜2文）/ changed（機械分類から変えた項目の
#   リスト。変えていなければ false。severity/kind/scope/body/new のいずれか）。
# kind: null は「該当なし」という判断（無理に ADR の enum に当てはめない）。
# 上の「severity / kind の付け方」は Phase A の機械分類の記録で、現在の値は review が正。
#
# caveat_scope（どの注記がどの範囲に掛かるか）は registry/caveat_scope.yaml に移した
# （build_caveat.py はそれを読むだけ）。上のコメント中の「build_caveat.py にある」は旧記述。
#
# flowTidalBackflow（Issue #35）: 流量の感潮域の逆流。以前は variable.yaml の hydro.flow の
# description_ja に埋め込んでいた。scope は variable（common:variable:hydro.flow）。

caveats:
- key: measuredOn
  severity: info
  kind: null
  title_ja: null
  body_ja: measurements.measured_on には「2015-04-08」形式（検体値・215,445行）と「2015」形式（年度集計値・105,454行）が混在する（合成データを除く）。年度集計値は日本の年度（4月〜翌3月）を指す。この画面では両者を kind で区別している。
  quote: null
  review:
    reviewed_on: '2026-10-06'
    reviewer: claude（オーナー委任）
    owner_confirmed_on: '2026-10-07'
    reason: 年度集計値と検体値は grain で構造的に分離済みで、無視しても数値は誤らない。本文の件数が古かったので実測（合成データを除く）に直した。
    changed:
    - severity
    - body
- key: censoredLod
  severity: blocking
  kind: censoring
  title_ja: null
  body_ja: 全体の約24%は定量下限未満（原表記が「<0.5」など）。この画面の値は定量下限未満を定量下限値とみなして集計している（上限側の見積もり）。不検出（ND）は平均に含めない。折れ線では中抜きの点で示し、その定量下限値が実際に観測された値だとは読まないこと。
  quote: null
  review:
    reviewed_on: '2026-10-06'
    reviewer: claude（オーナー委任）
    owner_confirmed_on: '2026-10-07'
    reason: ND を観測値と読むと過大評価になる。実測で定量下限未満は 75,689/320,899行（23.6%）で本文の「約24%」は正しい。
    changed: false
- key: aboveLod
  severity: blocking
  kind: censoring
  title_ja: null
  body_ja: 透明度の定量上限超え（原表記が「>1.4」〜「>28」など、26行）は、上限がどこまでか分からないという性質上、集計方法によらず値に含められない。件数（n）にも入らないため、他の期間・地点と単純に比較しないこと。
  quote: null
  review:
    reviewed_on: '2026-10-06'
    reviewer: claude（オーナー委任）
    owner_confirmed_on: '2026-10-07'
    reason: 定量上限超えの26行は全て透明度で、無視して比較すると高透明度が落ちて偏る。効く範囲は透明度だけなので scope を measurements 全体から water.transparency に狭めた。
    changed:
    - scope
- key: duplicates
  severity: info
  kind: null
  title_ja: null
  body_ja: 同一の地点・日・項目に複数行あるのは、原本が採水時刻を落としているため。ここでは日ごとに平均して1点にまとめている。
  quote: null
  review:
    reviewed_on: '2026-10-06'
    reviewer: claude（オーナー委任）
    owner_confirmed_on: '2026-10-07'
    reason: 日平均にまとめる処理規則の説明で、無視しても値の解釈は変わらない（非合成で重複グループ71,356）。
    changed:
    - severity
- key: zone
  severity: info
  kind: null
  title_ja: null
  body_ja: ゾーンは標高と海岸線距離だけから機械的に付けた操作的定義であり、公式の区分ではない。zone 1（標高800m超）には水質データが無い。
  quote: null
  review:
    reviewed_on: '2026-10-06'
    reviewer: claude（オーナー委任）
    owner_confirmed_on: '2026-10-07'
    reason: 操作的定義であることの断りで、比較は成立する。zone 1 は4地点で測定0件（本文どおり）。
