- key: organismSite
  severity: warning
  kind: null
  title_ja: null
  body_ja: 生物レコードには site_id が無い（原本で全件 NULL）。流域への割り当ては緯度経度と国土数値情報 W12（1977年版）ポリゴンの点内包判定によるもので、原本の属性ではない。流域に割り当てられない記録（流域外・未解決）が、日付のある記録の約10%（83,515件/816,856件）ある。
  quote: null
  review:
