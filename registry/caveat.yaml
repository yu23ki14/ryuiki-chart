- key: effort
  severity: blocking
  kind: null
  title_ja: null
  body_ja: 生物観察の件数は観察努力（観察に参加した人や調査の回数）に強く影響される。記録者を特定する列は大半が空（GBIF の約89%、iNaturalist は全件）で、記録者数そのものは測れていない。件数の増加をそのまま「生物が増えた」と読んではいけない。
  quote: null
  review:
    reviewed_on: '2026-10-06'
    reviewer: claude（オーナー委任）
    owner_confirmed_on: '2026-10-07'
    reason: 件数の増加を実体の増加と読むと結論が誤る。「記録した人の数」は記録者列が大半 NULL（GBIF 88.6%・iNaturalist 100%）で裏付けられないため、測れる事実に置き換えた。
