# 注意事項（caveat）レジストリ（docs/plans/PHASE_A.md §A-5, docs/adr/0013-caveats.md）。
#
# 現行の注記14件をそのまま移したもの:
#   - web/src/lib/domain.ts の DATA_CAVEATS（7件）: measuredOn censored duplicates
#     zone organismSite effort synthetic
#   - web/src/lib/domain.ts の BIOTA_CAVEATS（6件）: regimes gbifCutoff share
#     inatBackfill fishClass isAlien
#   - web/src/lib/ai/caveats.ts に直書きの municipality（1件）。
#     MUNICIPALITY_LABEL（"水域・地域"）を埋め込んだ本文を、現行と完全に同じ文字列で複製している。
#
# body_ja は1文字も変えていない（web/src/lib/ai/caveats.test.ts の34ケースとの一致で検証済み。
# 検証手順は scripts/registry/build_caveat.py の docstring を参照）。
# 新しい注記はここに足していない（PHASE_A.md §A-5 の4）。
#
# caveat_id は common:caveat:<key>（scripts/registry/common.py の caveat_id()）。
# この yaml では key だけを書き、caveat_id はビルド時に導出する。
#
# severity / kind の付け方（build_caveat.py にも同じ説明あり）:
#   - severity='blocking' は、本文が「てはいけない」「読まないこと」「はできない」
#     「意味がない」「信頼できない」など明示的な禁止・否定表現を含むものだけに限定した。
#     それ以外は severity を null のままにしている（推測で厳格化しない）。
#   - kind は docs/adr/0013-caveats.md の enum
#     （time_series_break/unit_change/method_change/definition_change/censoring/
#     coverage_gap/synthetic/embargo/known_error）に文言がほぼそのまま対応するものだけ付けた。
#     無理に当てはめず、決められないものは null のままにしている。
#   - title_ja / quote は元が手書きの説明文（原本からの引用ではない）なので null のまま。
#     引用（quote）を持つのは cells.notes 由来の caveat（build_caveat.py が別途生成、
#     この yaml には含まれない）。
#
# caveat_scope（テーブル→注記のマッピング）はこの yaml には含まない。
# scripts/registry/build_caveat.py がテーブル名の集合をコードに埋め込んで caveat_scope に書く
# （マッピング自体は web/src/lib/ai/caveats.ts の SITES_CAVEATS 等の再現であり、
# データというよりロジックの複製にあたるため。理由は build_caveat.py の docstring）。

caveats:
- key: measuredOn
  severity: null
  kind: null
  title_ja: null
  body_ja: measurements.measured_on には「2015-04-08」形式（検体値・216,990行）と「2015」形式（年度集計値・98,328行）が混在する。年度集計値は日本の年度（4月〜翌3月）を指す。この画面では両者を kind で区別している。
  quote: null
- key: censored
  severity: blocking
  kind: censoring
  title_ja: null
  body_ja: 全体の約24%は定量下限未満（原表記が「<0.5」など）で、value 列には 0 が入っている。折れ線では中抜きの点で示し、平均には含めるが「0 が観測された」とは読まないこと。
  quote: null
- key: duplicates
  severity: null
  kind: null
  title_ja: null
  body_ja: 同一の地点・日・項目に複数行あるのは、原本が採水時刻を落としているため。ここでは日ごとに平均して1点にまとめている。
  quote: null
- key: zone
  severity: null
  kind: null
  title_ja: null
  body_ja: ゾーンは標高と海岸線距離だけから機械的に付けた操作的定義であり、公式の区分ではない。zone 1（標高800m超）には水質データが無い。
  quote: null
- key: organismSite
  severity: null
  kind: null
  title_ja: null
  body_ja: 生物レコードには site_id が無い（原本で全件 NULL）。流域への割り当ては緯度経度と国土数値情報 W12（1977年版）ポリゴンの点内包判定によるもので、原本の属性ではない。
  quote: null
- key: effort
  severity: blocking
  kind: null
  title_ja: null
  body_ja: 生物観察の件数は観察努力（記録した人の数）に強く影響される。件数の増加をそのまま「生物が増えた」と読んではいけない。
  quote: null
- key: synthetic
  severity: blocking
  kind: synthetic
  title_ja: null
  body_ja: 観測者・介入・意思決定・品質段階の遷移は合成データ（デモ用に生成したもの）。実在の公開データではない。
  quote: null
- key: regimes
  severity: blocking
  kind: time_series_break
  title_ja: null
  body_ja: 記録の中身は年代で入れ替わっている。2013–2016 は標本由来の植物、2017–2024 は eBird 由来の鳥類、2025 以降は iNaturalist 由来の昆虫・植物・菌類が中心。分類群をまたいだ件数の比較はできない。
  quote: null
- key: gbifCutoff
  severity: blocking
  kind: coverage_gap
  title_ja: null
  body_ja: GBIF 側の取り込みは 2024年12月で実質途切れている（2025年1月に月8,750件→399件）。鳥類の2025年以降の減少はデータの都合であり、生きものの減少ではない。
  quote: null
- key: share
  severity: blocking
  kind: null
  title_ja: null
  body_ja: 件数そのものではなく、同じ分類群の中での割合（‰）で比べている。観察する人が増えれば件数は全種で一斉に増えるため、生の件数の増減には意味がない。
  quote: null
- key: inatBackfill
  severity: null
  kind: method_change
  title_ja: null
  body_ja: iNaturalist 由来の 165,332 件は分類階級が空だったため、学名の先頭2語をキーに GBIF 側の分類を引き当てて補完している（96%が解決）。
  quote: null
- key: fishClass
  severity: null
  kind: definition_change
  title_ja: null
  body_ja: 魚類は class 列に現れない（Actinopterygii が入っておらず空になっている）。門が Chordata で綱が空のものを魚類として扱っている。
  quote: null
- key: isAlien
  severity: blocking
  kind: known_error
  title_ja: null
  body_ja: 原本の is_alien フラグは同一種の中で 1 と 0 が混在し、オオクチバスやウシガエルが 0 件になるなど信頼できない。外来種の判定には環境省の生態系被害防止外来種リスト（taxa.ias_category）を学名で結合した結果を使っている。
  quote: null
- key: municipality
  severity: null
  kind: null
  title_ja: null
  body_ja: sites.municipality は出典によって中身が違う。環境省 公共用水域の290地点では水域名（河川名・湖沼名）が入り、それ以外の62地点では市区町村名が入る。列名と中身が一致していないため、この画面では「水域・地域」と呼ぶ。
  quote: null
