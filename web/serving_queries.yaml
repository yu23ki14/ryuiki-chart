# serving-snapshot（`pnpm run serving:snapshot`）が回す問い合わせの一覧。
#
# 設計: `docs/plans/V2_SERVING_PR5.md` §3.2・§3.3。経緯: Issue #48 PR-1〜PR-4（v1 と突き合わせる serving-diff。
# PR-5 で v1 側ごと撤去し、この一覧は「v2 の出力を残す」道具の入力になった）。
#
# ここに SQL は書かない（`domains` の列挙 SQL だけが例外）。各問い合わせの実体（`@/lib/cube` の公開関数を
# 画面・API・AI と同じ既定値で呼ぶ）は `web/scripts/lib/serving/adapters-v2.ts` が `id` ごとに持つ。
# ここが持つのは「パラメータをどう列挙するか」「行をどの列で比較・記録するか」「run の上限」だけ。
#
# 残す問い合わせの規則: `adapters-v2` がその id で呼ぶ公開関数に、`web/src/app`・`web/src/components`・
# `web/src/lib/ai` の**テスト以外**の呼び出し元がある。alias 起点の問い合わせ（旧 v1 の oracle 専用）と、
# 呼び出し元の無い `speciesLabels`/`redlistFlows`/`redlistSpecies`/`watershedYears` は PR-5 で落とした。
#
# domains: パラメータの取りうる値。v2 から導く（`db: v2|registry|ryuiki|cells`。executor は4つを ATTACH した
# 1本の接続で流すので、表名は非修飾で書く。`c.`/`d.` で始まるエイリアスは D1 互換検査が落とす）。`sql` は
# **実在する組だけ**を返す（空走りを防ぐ）。`columns` を持つ domain は複数列を1つの軸（組）にする。
# 問い合わせの `params.<name>.column`（省略時は param 名）が列を引き、同じ domain を引く param は1つの軸になる。
# `values` は列挙のリテラル。値は executor が決定論的な全順序（数値は数値順・文字列は UTF-16 順）に並べる。
#
# queries の任意キー:
#   max_runs: {snapshot: n, fingerprint: n}（どちらも省略可）。既定は snapshot 12 / fingerprint 60。
#   allow_empty: true  空が正常な問い合わせだけ（空振り検査の対象外）。理由をコメントに書く。
version: 2

domains:
  # 測定値（dataset='measurements'。センサー系列は含めない）を持つ地点（`sites.site_id`）。
  # 以下の summary_place_variable 起点の domain も同じ絞り込み（`representativeSeries(variableId, 'measurements')` が空で落ちないように）。
  site_id:
    db: v2
    columns: [site_id]
    sql: >
      SELECT DISTINCT psr.external_key AS site_id
      FROM summary_place_variable spv
      JOIN place_source_ref psr ON psr.place_id = spv.place_id AND psr.source_id = 'sites.site_id'
      WHERE spv.variable_id IN (SELECT variable_id FROM variable_alias WHERE dataset = 'measurements' AND variable_id IS NOT NULL)
  # 測定値の variable_id（レジストリ上の正準 ID）。
  variable_id:
    db: registry
    columns: [variable_id]
    sql: "SELECT DISTINCT variable_id FROM variable_alias WHERE dataset = 'measurements' AND variable_id IS NOT NULL"
  # 実在する (variable_id, site_id, basis)。basis は `lib/cube/series.ts` の `basisOfCell` と同じ式
  # （input_grain='day' → day、そうでなければ grain='year' → year、それ以外 fiscal_year）。
  # `input_grain = grain`（出典配布）と、月までしか日付が言えない日間平均値の月からの積み上げ
  # （value_grain≠'month'。厚木、Issue #32-2）だけを通す（hour 入力の年値は basis='year' の系列ではない）。
  variable_site_basis:
    db: v2
    columns: [variable_id, site_id, basis]
    sql: >
      SELECT DISTINCT spv.variable_id AS variable_id, psr.external_key AS site_id,
             CASE WHEN spv.input_grain = 'day' THEN 'day' WHEN spv.grain = 'year' THEN 'year' ELSE 'fiscal_year' END AS basis
      FROM summary_place_variable spv
      JOIN place_source_ref psr ON psr.place_id = spv.place_id AND psr.source_id = 'sites.site_id'
      WHERE (spv.input_grain = 'day' OR spv.input_grain = spv.grain
             OR (spv.input_grain = 'month' AND spv.value_grain <> 'month'))
        AND spv.variable_id IN (SELECT variable_id FROM variable_alias WHERE dataset = 'measurements' AND variable_id IS NOT NULL)
  # 日次の積み上げがある (variable_id, site_id)（月次・日次の系列）。
  variable_site_day:
    db: v2
    columns: [variable_id, site_id]
    sql: >
      SELECT DISTINCT spv.variable_id AS variable_id, psr.external_key AS site_id
      FROM summary_place_variable spv
      JOIN place_source_ref psr ON psr.place_id = spv.place_id AND psr.source_id = 'sites.site_id'
      WHERE spv.input_grain = 'day'
        AND spv.variable_id IN (SELECT variable_id FROM variable_alias WHERE dataset = 'measurements' AND variable_id IS NOT NULL)
  # 実在する (variable_id, basis)（ゾーン系列）。
  variable_basis:
    db: v2
    columns: [variable_id, basis]
    sql: >
      SELECT DISTINCT spv.variable_id AS variable_id,
             CASE WHEN spv.input_grain = 'day' THEN 'day' WHEN spv.grain = 'year' THEN 'year' ELSE 'fiscal_year' END AS basis
      FROM summary_place_variable spv
      WHERE (spv.input_grain = 'day' OR spv.input_grain = spv.grain
             OR (spv.input_grain = 'month' AND spv.value_grain <> 'month'))
        AND spv.variable_id IN (SELECT variable_id FROM variable_alias WHERE dataset = 'measurements' AND variable_id IS NOT NULL)
  # 水域（`sites.municipality`）。測定値を持つ地点が2つ以上ある水域だけ。
  water:
    db: ryuiki
    columns: [water]
    sql: >
      SELECT s.municipality AS water
      FROM sites s
      JOIN place_source_ref psr ON psr.external_key = s.site_id AND psr.source_id = 'sites.site_id'
      WHERE s.municipality IS NOT NULL AND s.municipality <> ''
        AND psr.place_id IN (SELECT DISTINCT place_id FROM summary_place_variable)
      GROUP BY s.municipality
      HAVING COUNT(DISTINCT s.site_id) >= 2

  # ---- 生物系 ----
  # n≥80 の種（`summary_species_catalog`。画面・API の足切りと同じ）。
  binom_n80:
    db: v2
    columns: [binom]
    sql: "SELECT binom FROM summary_species_catalog WHERE n >= 80"
  # 分類群（`summary_group_year`）。
  group:
    db: v2
    columns: [taxon_group]
    sql: "SELECT DISTINCT taxon_group FROM summary_group_year WHERE taxon_group IS NOT NULL"
  # `speciesShareTrend` の期間 A/B の組（`<aFrom>-<aTo>:<bFrom>-<bTo>`。/biota の既定の増減表と、古い期間どうしの比べ）。
  trend_periods:
    values: ["2018-2020:2022-2024", "1990-2000:2010-2020"]
  # `/api/geo/mesh?year=` が取りうる年（`summary_grid_catalog` の窓 1970〜2026）。
  year:
    values: [1970, 1971, 1972, 1973, 1974, 1975, 1976, 1977, 1978, 1979, 1980, 1981, 1982, 1983, 1984, 1985, 1986, 1987, 1988, 1989, 1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
  # 文書系列（3年以上の年を持つ (doc_id, table_id, row_key)。`lib/cube/doc-series-where.ts` の `DOC_SERIES_WHERE` と同じ述語）。
  doc_series:
    db: cells
    columns: [doc_id, table_id, row_key]
    sql: >
      SELECT doc_id, table_id, row_key
      FROM cells
      WHERE superseded = 0 AND is_total = 0 AND value_type IN ('int','float') AND value IS NOT NULL
        AND fiscal_year IS NOT NULL AND row_key IS NOT NULL AND row_key <> ''
      GROUP BY doc_id, table_id, row_key
      HAVING COUNT(DISTINCT fiscal_year) >= 3

queries:
  # ---- 測定値（variable_id 起点。画面・API・AI が使う経路）----
  - id: sites_list
    params: {}
    compare:
      key: [site_id]
      numeric: [n_meas, n_var]
      label: []

  - id: water_bodies
    params: {}
    compare:
      key: [name]
      numeric: [n_sites, n_meas, y_from, y_to, elev_min, elev_max, zone_min, zone_max]
      label: []

  - id: sites_in_water_body
    params:
      water: { domain: water }
    compare:
      key: [site_id]
      numeric: [n_meas, n_var]
      label: [municipality]

  - id: variable_catalog_by_variable
    params: {}
    compare:
      key: [variable_id]
      numeric: [n, n_places, y_from, y_to, n_censored]
      label: [unit]

  # `stat`（obs_stat）は key に含めない: variable_id×basis まで束ねる。
  - id: site_variables_by_variable
    params:
      site_id: { domain: site_id }
    compare:
      key: [variable_id, basis]
      numeric: [n, y_from, y_to, avg]
      label: [unit]

  - id: year_series_site_by_variable
    params:
      variable_id: { domain: variable_site_basis }
      site_id: { domain: variable_site_basis }
      basis: { domain: variable_site_basis }
    compare:
      key: [year]
      numeric: [n, avg, min, max, n_censored]
      label: [unit]

  # 日次・月次は行が多いので snapshot の run を絞る（コミットするファイルの大きさ）。
  - id: month_series_site_by_variable
    max_runs: { snapshot: 6 }
    params:
      variable_id: { domain: variable_site_day }
      site_id: { domain: variable_site_day }
    compare:
      key: [ym]
      numeric: [n, avg]
      label: []

  - id: day_series_site_by_variable
    max_runs: { snapshot: 3, fingerprint: 30 }
    params:
      variable_id: { domain: variable_site_day }
      site_id: { domain: variable_site_day }
    compare:
      key: [d]
      numeric: [value, n_censored]
      label: []

  - id: zone_series_by_variable
    params:
      variable_id: { domain: variable_basis }
      basis: { domain: variable_basis }
    compare:
      key: [zone, year]
      numeric: [n_sites, n, avg]
      label: [unit]

  - id: climatology_by_variable
    params:
      variable_id: { domain: variable_id }
    compare:
      key: [month]
      numeric: [n, avg, min, max]
      label: [unit]

  - id: zone_climatology_by_variable
    params:
      variable_id: { domain: variable_id }
    compare:
      key: [zone, month]
      numeric: [n, avg]
      label: [unit]

  - id: water_bodies_for_variable_by_variable
    # 縮小サンプルでは「その変数で2地点以上を持つ水域」がごく少数の変数にしか無い（`waterBodies` の
    # HAVING n_sites >= 2）。等間隔の12件だと全部空に当たりうるので、サンプルの snapshot は全変数を見る。
    max_runs: { snapshot: 60 }
    params:
      variable_id: { domain: variable_id }
    compare:
      key: [name]
      numeric: [n_sites, n, y_from, y_to, elev_max]
      label: []

  # 季節図（`/api/timeseries?mode=season`）が使う雨量の月別平年値。
  - id: rain_monthly_clim
    params: {}
    compare:
      key: [month]
      numeric: [mm]
      label: []

  # ---- 生物系 ----
  - id: effort_years
    params: {}
    compare:
      key: [year]
      numeric: [n, species_n, mesh_n, n_inat, n_gbif]
      label: []

  - id: taxon_group_years
    params: {}
    compare:
      key: [year, taxon_group]
      numeric: [n, mesh_n]
      label: []

  # 上位 N は比べない（limit 無制限で全行）。`cls` = v2 の `class`。`has_red_list` は `n_red_list > 0`。
  - id: species_catalog
    params: {}
    compare:
      key: [binom]
      numeric: [n, has_red_list, y_from, y_to, n_years, mesh_n]
      label: [taxon_group, cls, family, label]

  - id: species_years
    params:
      binom: { domain: binom_n80 }
    compare:
      key: [year]
      numeric: [n, mesh_n]
      label: []

  - id: species_months
    params:
      binom: { domain: binom_n80 }
    compare:
      key: [month]
      numeric: [n]
      label: []

  - id: species_mesh_years
    max_runs: { snapshot: 4 }
    params:
      binom: { domain: binom_n80 }
    compare:
      key: [year, mlat, mlon]
      numeric: [n]
      label: []

  - id: species_share_trend
    # 縮小サンプルでは種ごとの件数が `SHARE_MIN_N_A/B`（40/20）を超える（分類群, 期間）が1組
    # （シダ植物, 1990-2000:2010-2020）しか無い。等間隔の12件だと外れうるので、snapshot は全組（28）を見る。
    max_runs: { snapshot: 28 }
    params:
      group: { domain: group }
      periods: { domain: trend_periods }
    compare:
      key: [binom]
      numeric: [n_a, n_b, total_a, total_b]
      label: [label]

  - id: mesh_all
    params: {}
    compare:
      key: [mlat, mlon]
      numeric: [n, rl_n, species_n, rl_species_n]
      label: []

  - id: mesh_by_year
    max_runs: { snapshot: 6 }
    params:
      year: { domain: year }
    compare:
      key: [mlat, mlon]
      numeric: [n, species_n, rl_n]
      label: []

  - id: ias_species
    params: {}
    compare:
      key: [ias_category, binom]
      numeric: [n, mesh_n, y_from, y_to, n_since_2020]
      label: [name_ja, taxon_group]

  - id: redlist_summary
    params: {}
    compare:
      key: [list_year, taxon_group_ja, direction]
      numeric: [n]
      label: [list_name]

  # key が空 = 1 行だけの問い合わせ。`mesh` は v2 の `grids`。
  - id: biota_totals
    params: {}
    compare:
      key: []
      numeric: [records, species, mesh, gbif, inat]
      label: []

  # ---- 流域・文書・概況 ----
  # 本番経路（/map の流域ポリゴン・AI get_overview）: `watershedRollup(db)`。全 377 流域。
  - id: watershed_rollup
    params: {}
    compare:
      key: [watershed_id]
      numeric:
        - org_n
        - org_alien_n
        - org_redlist_n
        - site_n
        - area_km2
        - centroid_lat
        - centroid_lon
        - built_km2_2006
        - built_km2_2016
        - forest_km2_2006
        - forest_km2_2016
        - paddy_km2_2006
        - paddy_km2_2016
      label: [water_system_name]

  # `api/documents` と同じ minYears=3。
  - id: doc_series_meta
    params: {}
    compare:
      key: [doc_id, table_id, row_key]
      numeric: [n_years, y_from, y_to, page_no, n_warnings]
      label: [label, unit, doc_title, publisher, url, license]

  - id: doc_series_points
    max_runs: { snapshot: 6 }
    params:
      doc_id: { domain: doc_series }
      table_id: { domain: doc_series }
      row_key: { domain: doc_series }
    compare:
      key: [fiscal_year]
      numeric: [value, page_no]
      label: [unit]

  # 1 行だけ。
  - id: overview_counts
    params: {}
    compare:
      key: []
      numeric: [n_sites, n_sources, n_watersheds, y_from, y_to]
      label: []

  # 建物用地の 2006→2016 の増加上位 8（`app/page.tsx` と同じ limit=8）。
  - id: landuse_highlight
    params: {}
    compare:
      key: [watershed_id]
      numeric: [delta, area_km2]
      label: [water_system_name]
