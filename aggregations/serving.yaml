# `observation_agg`（`scripts/b04_build_cube.py`）・`occurrence_agg`
# （`scripts/b07_build_occurrence_cube.py`）から、画面・API・AI が直接
# 読む summary 8表（`scripts/b13_build_summary.py` が作る
# `summary_variable_catalog`/`summary_place_variable`〔observation_agg 由来、
# Issue #48 PR-2 §4〕・`summary_taxon_catalog`/`summary_watershed_occurrence`
# 〔occurrence_agg 由来、Issue #48 PR-3a §5〕・`summary_species_catalog`/
# `summary_group_year`/`summary_effort_year`/`summary_grid_catalog`
# 〔occurrence_agg ＋ registry の taxon 結合、binom 単位。Issue #48 PR-3b §2.1〕）を
# 宣言する（ADR-0011）。
#
# `scripts/b13_build_summary.py` はこのファイルを読むだけで、どの列で GROUP BY
# するか・どの測度（measure）を作るかを決める——テーブルごとの分岐はコード側に
# 書かない（`scripts/reconcile/projection_manifest.yaml` と同じ流儀）。
#
# 語彙は閉じている（b13 が起動時に検証し、未知の語彙・列は止まる）:
#   - `source` ∈ {observation_agg, occurrence_agg}
#   - `fn` ∈ {sum, count_distinct, min, max, avg}（`count_distinct` は `col`
#     ——例 `COUNT(DISTINCT place_id)`——にも `expr`——例
#     `COUNT(DISTINCT year_of_period_start)`——にも使える）
#   - `expr` ∈ {year_of_period_start}（`CAST(substr(period_start,1,4) AS INTEGER)`）
#   - `filter`/`group_by`/`key` の列は、その summary の `source` の次元キー
#     （observation_agg: `scripts/b04_build_cube.py` の `DIM_COLUMNS`、
#     occurrence_agg: `scripts/b07_build_occurrence_cube.py` の `DIM_COLUMNS`）
#     のみ——source をまたいだ列名の流用はできない（b13 が source ごとに
#     許容集合を持って検証する）
#   - 測度の `col` は同じ source の次元キー、または値列
#     （observation_agg: `value_zero`/`value_lod`/`n`/`n_censored`/
#     `n_not_detected`/`n_places`、occurrence_agg: `n`/`n_red_list`/`n_alien`）
#   - **`source: occurrence_agg` の summary は `filter.grain` を必須とする**
#     （`occurrence_agg` は year 族 `{year, survey_period}` と month 族
#     `{month}` の2つの分割を同居させている——PR-3a 設計書 §9-2。`filter.grain`
#     を書き忘れると、族をまたいだ二重計上を「保存則（SUM(n) の一致）」検証が
#     検出できない——比較先の `observation_agg`/`occurrence_agg` 側の SUM(n) も
#     同じ〔絞り込み忘れの〕`filter` で計算するため）。**列があるだけでは不十分
#     で、値も `b07.YEAR_GRAIN_FAMILY`（`[year, survey_period]`）か
#     `b07.MONTH_GRAIN_FAMILY`（`[month]`）のどちらか1つの族にちょうど
#     一致していなければ止める**——`[year, month]` のように族を跨ぐ値は
#     「列はある」だけでは検出できず、族をまたいだ二重計上を招く
#     （/code-review 指摘5）。
#
# PR-3b（D1）で足した語彙（b13 の拡張はこの4つだけ）:
#   - `join: {taxon: registry}`: `registry.sqlite` を `ATTACH ... mode=ro` して
#     `taxon_id` で LEFT JOIN する（`taxon` は主キー結合なので行は増減しない——b13 が
#     毎回確かめる）。結合先の列（`taxon.canonical_binomial`/`taxon_group`/`class`/
#     `family`）は `columns`・measures の `col`・`filter` に `taxon.<列>` の形で書く。
#     `source: occurrence_agg` だけに使える。registry が無い・`taxon` 表が無ければ止まる。
#   - `columns: {名前: {col|expr, coalesce}}`: group_by に出す、キューブの次元キーでは
#     ない列の定義（`expr: year_of_period_start`、`col: taxon.taxon_group`、
#     `coalesce: '未判定'`〔NULL をその文字列に畳む〕）。
#   - `filter: {<結合先の列>: {not_null: true}}`: 結合先の列が NULL の行を落とす。
#   - measure の `when: {year_between: [lo, hi], positive: <col>}`: 条件つき集計
#     （`sum`/`count_distinct` だけ）。窓を焼く（`summary_grid_catalog`）ためのもの。
#     保存則は `n` 測度の `when` を掛けた側と比べる。
#   - 2026-10-07: `when: {place_kind: <値>}`。`filter.place_kind` に [grid01, watershed] の
#     両方を入れ、測度ごとにどちらの系列から数えるかを選ぶ。n は watershed（place_id NULL=
#     座標なし・流域外のセルを含む、日付のある全記録）、n_places（meshN）は grid01
#     （座標のある記録）。y_from/y_to/n_years/n_binom は絞らない（2系列の和集合＝全記録）。
#
# `key` は必ず `group_by` と同じ集合にすること（summary は1グループ=1行の
# ロールアップで、`key` がその一意性を保証する次元）。
#
# variable_id/binom 単位への束ね・代表化は**ここに書かない**——それは問い合わせ層
# （`web/src/lib/cube/catalog.ts`、生物系は PR-3b で追加予定の同種のモジュール）の
# 仕事。summary は系列単位（`obs_stat`/`unit_id`/`value_grain`、または
# `taxon_id`/`place_id` そのもの）を保ったままのロールアップにとどめる
# （`nPlaces` を alias/variable 単位に単純合算すると二重計上する、という
# PR-1 の知見どおり）。

version: 1
spec_version: serving-summary/v6

summaries:
  summary_variable_catalog:
    source: observation_agg
    filter: { place_kind: site, grain: [year, fiscal_year], stat: mean }
    group_by: [variable_id, obs_stat, unit_id, value_grain, grain, input_grain]
    measures:
      n:              { fn: sum, col: n }
      n_places:       { fn: count_distinct, col: place_id }
      y_from:         { fn: min, expr: year_of_period_start }
      y_to:           { fn: max, expr: year_of_period_start }
      n_censored:     { fn: sum, col: n_censored }
      n_not_detected: { fn: sum, col: n_not_detected }
    key: [variable_id, obs_stat, unit_id, value_grain, grain, input_grain]
    indexes: [[variable_id]]

  summary_place_variable:
    source: observation_agg
    filter: { place_kind: site, grain: [year, fiscal_year], stat: mean }
    group_by: [place_id, variable_id, obs_stat, unit_id, value_grain, grain, input_grain]
    measures:
      n:              { fn: sum, col: n }
      y_from:         { fn: min, expr: year_of_period_start }
      y_to:           { fn: max, expr: year_of_period_start }
      avg_zero:       { fn: avg, col: value_zero }
      avg_lod:        { fn: avg, col: value_lod }
      n_censored:     { fn: sum, col: n_censored }
      n_not_detected: { fn: sum, col: n_not_detected }
    key: [place_id, variable_id, obs_stat, unit_id, value_grain, grain, input_grain]
    indexes: [[place_id], [variable_id]]

  # v1 `species2`/`mesh_species` の後継。binom 束ね・表示名・RL 評価との突合は
  # `catalog.ts`（PR-3b）の仕事——ここは `taxon_id` 単位のロールアップのまま。
  # `taxon_id IS NULL`（分類群未解決）の行も落とさず1行として持つ。
  summary_taxon_catalog:
    source: occurrence_agg
    filter: { place_kind: grid01, grain: [year, survey_period] }
    group_by: [taxon_id]
    measures:
      n:          { fn: sum, col: n }
      n_red_list: { fn: sum, col: n_red_list }
      n_alien:    { fn: sum, col: n_alien }
      n_places:   { fn: count_distinct, col: place_id }   # v1 mesh_n 相当
      y_from:     { fn: min, expr: year_of_period_start }
      y_to:       { fn: max, expr: year_of_period_start }
      n_years:    { fn: count_distinct, expr: year_of_period_start }
    key: [taxon_id]
    indexes: [[taxon_id]]

  # v1 `org_watershed`/`org_watershed_year` の後継（年ロールアップ側）。
  # `place_id IS NULL`（流域に解決できない日付あり記録、ADR-0025/0026 D1）の
  # 行も落とさず1行として持つ——画面は `place_id IS NOT NULL` で絞る。
  summary_watershed_occurrence:
    source: occurrence_agg
    filter: { place_kind: watershed, grain: [year, survey_period] }
    group_by: [place_id]
    measures:
      n:          { fn: sum, col: n }
      n_red_list: { fn: sum, col: n_red_list }
      n_alien:    { fn: sum, col: n_alien }
      n_taxa:     { fn: count_distinct, col: taxon_id }
      y_from:     { fn: min, expr: year_of_period_start }
      y_to:       { fn: max, expr: year_of_period_start }
    key: [place_id]
    indexes: [[place_id]]


  # ---- PR-3b（D1）: binom（`taxon.canonical_binomial`）単位の表。v1 の「二名法キー
  # の DISTINCT」と同じ種数を出すため、registry の taxon を結合して作る。いずれも最終
  # 粒度の表で、再集計しない（非加法の二重計上は起きない）。`taxon_id` が NULL の
  # セルは binom が NULL なので、binom の DISTINCT には数えない（v1 と同じ）。

  # v1 `species2` の後継。`taxon_group`/`class`/`family` は v1 の `MAX(...)` と同じ規則。
  # `taxon_id IS NULL`・binom が取れない taxon の行は含まない（binom がキーのため）。
  summary_species_catalog:
    source: occurrence_agg
    join: { taxon: registry }
    filter:
      place_kind: [grid01, watershed]
      grain: [year, survey_period]
      taxon.canonical_binomial: { not_null: true }
    columns:
      binom: { col: taxon.canonical_binomial }
    group_by: [binom]
    measures:
      taxon_group: { fn: max, col: taxon.taxon_group }
      class:       { fn: max, col: taxon.class }
      family:      { fn: max, col: taxon.family }
      n:           { fn: sum, col: n,          when: { place_kind: watershed } }
      n_red_list:  { fn: sum, col: n_red_list, when: { place_kind: watershed } }
      n_alien:     { fn: sum, col: n_alien,    when: { place_kind: watershed } }
      n_places:    { fn: count_distinct, col: place_id, when: { place_kind: grid01 } }
      y_from:      { fn: min, expr: year_of_period_start }
      y_to:        { fn: max, expr: year_of_period_start }
      n_years:     { fn: count_distinct, expr: year_of_period_start }
    key: [binom]
    indexes: [[binom]]

  # v1 `org_group_year` の後継。taxon_id が NULL（または taxon_group が NULL）の
  # セルは '未判定' に畳む（畳まないと v1 と 31 キーが割れる）。年の窓（1970〜2026）は
  # 持たない（問い合わせの WHERE で掛ける）。`n_places` は grid01 の DISTINCT。
  summary_group_year:
    source: occurrence_agg
    join: { taxon: registry }
    filter: { place_kind: [grid01, watershed], grain: [year, survey_period] }
    columns:
      year:        { expr: year_of_period_start }
      taxon_group: { col: taxon.taxon_group, coalesce: '未判定' }
    group_by: [year, taxon_group, source_id]
    measures:
      n:        { fn: sum, col: n, when: { place_kind: watershed } }
      n_binom:  { fn: count_distinct, col: taxon.canonical_binomial }
      n_places: { fn: count_distinct, col: place_id, when: { place_kind: grid01 } }
    key: [year, taxon_group, source_id]
    indexes: [[year]]

  # v1 `effort_year` の後継。`n_inat`/`n_gbif` は持たない（n は加法なので
  # `summary_group_year` の `source_id` 別 `SUM(n)` から正確に引ける）。
  summary_effort_year:
    source: occurrence_agg
    join: { taxon: registry }
    filter: { place_kind: [grid01, watershed], grain: [year, survey_period] }
    columns:
      year: { expr: year_of_period_start }
    group_by: [year]
    measures:
      n:        { fn: sum, col: n, when: { place_kind: watershed } }
      n_binom:  { fn: count_distinct, col: taxon.canonical_binomial }
      n_places: { fn: count_distinct, col: place_id, when: { place_kind: grid01 } }
    key: [year]
    indexes: []

  # v1 `mesh_all`＋`mesh_species` の後継（グリッド通年）。`n`/`n_red_list` は
  # v1 `mesh_all` の窓（年 1970〜2026）を焼く。`n_binom`/`n_red_binom` は v1
  # `mesh_species` と同じく窓なし。窓外のセルしか持たないグリッドも1行出る（n=0）。
  summary_grid_catalog:
    source: occurrence_agg
    join: { taxon: registry }
    filter: { place_kind: grid01, grain: [year, survey_period] }
    group_by: [place_id]
    measures:
      n:            { fn: sum, col: n,          when: { year_between: [1970, 2026] } }
      n_red_list:   { fn: sum, col: n_red_list, when: { year_between: [1970, 2026] } }
      n_binom:      { fn: count_distinct, col: taxon.canonical_binomial }
      n_red_binom:  { fn: count_distinct, col: taxon.canonical_binomial, when: { positive: n_red_list } }
    key: [place_id]
    indexes: []
