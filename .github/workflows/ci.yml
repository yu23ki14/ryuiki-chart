name: CI

# docs/plans/PHASE_B_INTAKE.md #7。原本 3 ファイル（ryuiki/cells/derived, data/db/ に置く。
# .gitignore で除外されているため CI には無い）を必要とせず、`registry/` 配下の手書き
# ファイルとリポジトリのコードだけで完結する3ジョブ。Issue #29「縮小サンプル＋実行証明」で
# `sample-gate`・`full-gate-proof-check` の2ジョブを追加した（後述）。
#
# - registry: `scripts/r01_build_registry.py --files-only` で作った registry.sqlite から
#   generated.ts / generated-client.ts を再生成し、コミット済みの内容と一致するかを
#   `git diff --exit-code` で機械的に確認する（レジストリと生成物のずれをここで落とす）。
# - web: lint・型検査・テスト（`generated.test.ts` の再生成チェックが走るよう、
#   ここでも --files-only で registry.sqlite を用意する）。
# - reconcile: Phase B 突合ハーネス（scripts/b01_derived_baseline.py /
#   scripts/b02_derived_compare.py / scripts/b03_build_observation.py /
#   scripts/b04_build_cube.py / scripts/b05_project_v1.py / scripts/b06_build_occurrence.py /
#   scripts/b07_build_occurrence_cube.py / scripts/b08_project_occurrence_v1.py /
#   scripts/b09_build_occurrence_place.py /
#   scripts/reconcile/*.py / scripts/migrate/*.py）のフィクスチャテストと、以下の構造検証
#   （いずれも data/db/*.sqlite・data/db/derived.sqlite を一切必要としない）:
#     - reports/derived_baseline.json がコミットされ、schema_version が一致すること。
#     - scripts/reconcile/expected_diffs.yaml が読めて形（テーブル名 -> 宣言のリスト）を
#       満たし、テーブル名が derived_baseline.json に実在し、key の要素数がそのテーブルの
#       キー列数と一致し、kind が3種のいずれかであること
#       （scripts/b02_derived_compare.py の `main()` と同じ `common.validate_expected_diffs`
#       を呼ぶ。検証ロジックの二重定義を避けるため）。
#     - scripts/migrate/period_exceptions.yaml が読めて、各エントリが
#       period_grain_override/expected_row_count/reason/restoration_plan を持つこと
#       （`migrate.period.validate_period_exceptions_shape`）。
#     - scripts/migrate/source_regions.yaml（出典→region、region→utc_offset。
#       consumer ごとに複数のスクリプトが共有する——occurrence
#       〔scripts/b06_build_occurrence.py、O-1a〕と土地利用
#       〔scripts/b03_build_observation.py、P-1b〕）が読めて、各エントリが
#       必須キー（`consumer` を含む——省略すると構造検証で止める。オーナー
#       決定: 省略時に既定値へ黙って落ちる設計は採らない）を持ち、
#       utc_offset が `^[+-][0-9]{2}:[0-9]{2}$` の形で、expected_row_count
#       が整数であること（`migrate.source_regions.validate_source_regions_shape`）。
#     - scripts/migrate/occurrence_period_shapes.yaml（O-1a。observed_on の12形の宣言。
#       形の定義自体——正規表現・period_grain・展開規則——はコード
#       〔scripts/migrate/occurrence_period.py の `_SHAPE_DEFS`〕が正で、この YAML には
#       expected_row_count/note しか持たない）が読めて、各エントリが必須キーを持ち、
#       expected_row_count が整数で、宣言された形の名前の集合がコードの12形と
#       過不足なく一致すること（`migrate.occurrence_period.
#       validate_occurrence_period_shapes_shape`）。
#     - scripts/migrate/occurrence_cube_declarations.yaml（O-1b。leaf セル
#       〔grain='survey_period'〕の元記録数の宣言）が読めて、必須キーを持ち、
#       expected_row_count が整数で、宣言名の集合が `leaf_cell_source_rows` 1件と
#       過不足なく一致すること（`b07_build_occurrence_cube.
#       validate_cube_declarations_shape`）。
#     - scripts/migrate/occurrence_place_declarations.yaml（O-2a。ポリゴン数・
#       NULL件数・解決件数の宣言）が読めて、必須キーを持ち、expected_row_count が
#       整数で、宣言名の集合が3件と過不足なく一致すること
#       （`b09_build_occurrence_place.validate_place_declarations_shape`）。
#     - scripts/migrate/occurrence_watershed_v1_declarations.yaml（O-2a。v1のメモ化と
#       正確な結果の食い違い〔記録単位〕の宣言）が読めて、必須キーを持ち、
#       `memo_moved_records.breakdown` の3値の合計が `expected_count` と一致すること
#       （`b08_project_occurrence_v1.validate_watershed_declarations_shape`）。
#     - registry/taxon/redlist_category.yaml・redlist_category_alias.csv・
#       assessment_list.yaml・assessment_scope_exclusions.yaml（P-2。taxon_assessment の
#       語彙4ファイル）が読めて、code/list_id/(list_id,scientific_name) の重複が無く、
#       alias の code・除外の reasons が語彙に実在し、除外の実測件数（7種、
#       domestic_origin 6件・subspecies_binomial_contraction 2件）と一致すること
#       （`registry.build_taxon_assessment` の `load_redlist_category_codes`/
#       `load_redlist_category_alias`/`load_assessment_lists`/
#       `load_assessment_scope_exclusions`。原本DB・moe_ias_list.csvは使わない
#       ——taxon_assessment テーブル自体の構築は `--files-only` の対象外のまま）。
#   docs/plans/PHASE_B_RECONCILIATION.md §5「CI の限界」で明言しているとおり、
#   このジョブが保証するのはハーネス自体の正しさとこれらの構造検証だけ。実データ
#   （data/db/derived.sqlite、14GB）に対する b01 の再実行や b02 の完全モード突合は、
#   原本のある環境でしか走らない（ここではやらないし、やれない）。

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  PNPM_VERSION: "10.18.3"
  # scripts/r01_build_registry.py --files-only の既定の書き込み先は、正規の
  # data/db/registry.sqlite を壊さないよう別ファイル（registry_files_only.sqlite）だが、
  # CI では checkout のたびにまっさらなので、パスをここで明示して
  # r01_build_registry.py / build-registry-ts.mjs / generated.test.ts の3箇所が
  # 確実に同じファイルを指すようにする（3つとも RYUIKI_REGISTRY_DB を見る）。
  RYUIKI_REGISTRY_DB: ${{ github.workspace }}/data/db/registry_files_only.sqlite

jobs:
  registry:
    name: registry (files-only build matches committed generated files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install registry build deps
        run: pip install -r requirements.txt

      - name: Build registry.sqlite（原本DBを一切開かない）
        run: python3 scripts/r01_build_registry.py --files-only

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Regenerate generated.ts / generated-client.ts
        working-directory: web
        run: node scripts/build-registry-ts.mjs

      - name: レジストリと生成物がずれていないことを確認
        run: |
          git diff --exit-code \
            web/src/lib/registry/generated.ts \
            web/src/lib/registry/generated-client.ts

  web:
    name: web (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install registry build deps
        run: pip install -r requirements.txt

      - name: Build registry.sqlite（generated.test.ts が skip されないように用意する）
        run: python3 scripts/r01_build_registry.py --files-only

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: web
        run: pnpm run lint

      - name: 型検査
        working-directory: web
        run: pnpm exec tsc --noEmit

      - name: Test
        working-directory: web
        run: pnpm run test

  reconcile:
    name: reconcile (Phase B harness fixtures; does NOT touch real data)
    # ここが保証するのは docs/plans/PHASE_B_RECONCILIATION.md §5 のとおり、次の3点だけ:
    #   1. ハーネス自体（b01〜b05/reconcile/*/migrate/*）が正しく動くこと
    #      （scripts/tests/ は自前でフィクスチャ sqlite を作るので、
    #      原本 data/db/*.sqlite・data/db/derived.sqlite（.gitignore 済み、
    #      合計14GB）は要らないし、ここでは一切開かない）。
    #   2. reports/derived_baseline.json がコミットされていて、
    #      common.SCHEMA_VERSION と一致すること。
    #   3. 宣言ファイル2つ（expected_diffs.yaml / period_exceptions.yaml）が
    #      読めて、原本DBを必要としない範囲の形を満たすこと。
    # 保証しないこと: 実データに対する b01 の再実行、b02 の完全モード突合
    # （行レベルの内訳）。これらは原本のある環境でしか走らない。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Phase B 突合ハーネスのフィクスチャテスト（原本DBは使わない）
        run: pytest

      - name: derived_baseline.json がコミットされ schema_version が一致することを確認
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          sys.path.insert(0, "scripts")
          from reconcile import common

          path = pathlib.Path("reports/derived_baseline.json")
          if not path.exists():
              sys.exit(f"{path} が無い。scripts/b01_derived_baseline.py で作ってコミットすること。")

          data = json.loads(path.read_text(encoding="utf-8"))
          if data.get("schema_version") != common.SCHEMA_VERSION:
              sys.exit(
                  f"schema_version が想定と異なる（期待 {common.SCHEMA_VERSION}、"
                  f"実際 {data.get('schema_version')!r}）。"
                  "scripts/b01_derived_baseline.py を実行して作り直すこと。"
              )
          print(f"OK: {path} (schema_version={data['schema_version']}, tables={data['table_count']})")
          PY

      - name: 宣言ファイル（expected_diffs.yaml / period_exceptions.yaml / time_label_conventions.yaml / source_regions.yaml / occurrence_period_shapes.yaml / occurrence_cube_declarations.yaml）の構造検証（原本DBは使わない）
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          sys.path.insert(0, "scripts")
          import b07_build_occurrence_cube as b07
          import b08_project_occurrence_v1 as b08
          import b09_build_occurrence_place as b09
          from migrate import occurrence_period, period, source_regions
          from reconcile import common

          baseline = json.loads(pathlib.Path("reports/derived_baseline.json").read_text(encoding="utf-8"))

          # scripts/b02_derived_compare.py の main() が呼ぶのと同じ関数を呼ぶ
          # （検証ロジックの二重定義を避ける。common.load_expected_diffs 自体も
          # 「宣言のリストになっているか」という形を検証する）。
          expected_diffs_path = pathlib.Path("scripts/reconcile/expected_diffs.yaml")
          expected_diffs = common.load_expected_diffs(expected_diffs_path)
          common.validate_expected_diffs(expected_diffs, baseline["tables"], str(expected_diffs_path))
          n_declared = sum(len(v) for v in expected_diffs.values())
          print(f"OK: {expected_diffs_path}（テーブル{len(expected_diffs)}件・宣言{n_declared}件）")

          # scripts/b03_build_observation.py が呼ぶのと同じ読み込みで、かつ
          # CI ではさらに必須キーが揃っていることまで検証する。
          exceptions_path = pathlib.Path("scripts/migrate/period_exceptions.yaml")
          period.validate_period_exceptions_shape(exceptions_path)
          exceptions = period.load_period_exceptions(exceptions_path)
          print(f"OK: {exceptions_path}（{len(exceptions)}件の例外）")

          # time_label_conventions.yaml（センサーの縦線 設計 v2 T2）も同じ
          # 流儀で検証する。
          conventions_path = pathlib.Path("scripts/migrate/time_label_conventions.yaml")
          period.validate_time_label_conventions_shape(conventions_path)
          conventions = period.load_time_label_conventions(conventions_path)
          print(f"OK: {conventions_path}（{len(conventions)}件の宣言）")

          # source_regions.yaml（occurrence〔scripts/b06_build_occurrence.py〕と
          # 土地利用〔scripts/b03_build_observation.py、P-1b〕が consumer ごとに
          # 共有。ここでは consumer を指定せずファイル全体を検証する）/
          # occurrence_period_shapes.yaml（O-1a。scripts/b06_build_occurrence.py
          # が読む）も同じ流儀で検証する。
          source_regions_path = pathlib.Path("scripts/migrate/source_regions.yaml")
          source_regions.validate_source_regions_shape(source_regions_path)
          sources, regions = source_regions.load_source_regions(source_regions_path)
          print(f"OK: {source_regions_path}（出典{len(sources)}件・region{len(regions)}件）")

          period_shapes_path = pathlib.Path("scripts/migrate/occurrence_period_shapes.yaml")
          occurrence_period.validate_occurrence_period_shapes_shape(period_shapes_path)
          shapes = occurrence_period.load_period_shapes(period_shapes_path)
          print(f"OK: {period_shapes_path}（{len(shapes)}形の宣言）")

          # occurrence_cube_declarations.yaml（O-1b。scripts/b07_build_occurrence_cube.py
          # が読む leaf セルの元記録数の宣言）も同じ流儀で検証する。
          cube_declarations_path = pathlib.Path("scripts/migrate/occurrence_cube_declarations.yaml")
          b07.validate_cube_declarations_shape(cube_declarations_path)
          print(f"OK: {cube_declarations_path}")

          # occurrence_place_declarations.yaml（O-2a。scripts/b09_build_occurrence_place.py
          # が読む、ポリゴン数・NULL件数・解決件数の宣言）も同じ流儀で検証する。
          place_declarations_path = pathlib.Path("scripts/migrate/occurrence_place_declarations.yaml")
          b09.validate_place_declarations_shape(place_declarations_path)
          print(f"OK: {place_declarations_path}")

          # occurrence_watershed_v1_declarations.yaml（O-2a。scripts/b08_project_occurrence_v1.py
          # が読む、v1のメモ化と正確な結果の食い違い〔記録単位〕の宣言）も検証する
          # （構造が occurrence_cube_declarations.yaml 等とは違う専用の検証関数）。
          watershed_declarations_path = pathlib.Path(
              "scripts/migrate/occurrence_watershed_v1_declarations.yaml"
          )
          b08.validate_watershed_declarations_shape(watershed_declarations_path)
          print(f"OK: {watershed_declarations_path}")
          PY

      - name: taxon_assessment（P-2）の語彙4ファイルの構造検証（原本DBは使わない）
        run: |
          python3 - <<'PY'
          import sys

          sys.path.insert(0, "scripts")
          from registry import build_taxon_assessment as ta

          # registry/taxon/redlist_category.yaml + redlist_category_alias.csv
          # （code の重複・alias の code が語彙に実在すること）。
          codes = ta.load_redlist_category_codes()
          alias = ta.load_redlist_category_alias()
          print(f"OK: {ta.REDLIST_CATEGORY_YAML}（{len(codes)}コード）")
          print(f"OK: {ta.REDLIST_CATEGORY_ALIAS_CSV}（{len(alias)}件のalias）")

          # registry/taxon/assessment_list.yaml（list_id の重複・kind が既知の値）。
          lists = ta.load_assessment_lists()
          print(f"OK: {ta.ASSESSMENT_LIST_YAML}（{len(lists)}件のlist）")

          # registry/taxon/assessment_scope_exclusions.yaml（(list_id,
          # scientific_name) の重複・reasons が既知の値・実測件数〔7種、
          # domestic_origin 6件・subspecies_binomial_contraction 2件〕と一致）。
          exclusions = ta.load_assessment_scope_exclusions()
          print(f"OK: {ta.ASSESSMENT_SCOPE_EXCLUSIONS_YAML}（{len(exclusions)}件の除外）")
          PY

  sample-gate:
    name: sample-gate (v1+v2 pipeline reconciliation on the reduced sample)
    # Issue #29「縮小サンプル＋実行証明」A-4。data/sample/（コミット済みのテキスト、
    # 原本ではない）を使い捨ての checkout の中で正規のパス（data/db/・data/processed/）に
    # 展開し、v1（build-derived.mjs・build-geo.mjs・build-biota.mjs。build-water-geo.mjs は
    # サンプルに無い入力を要求するため対象外）と v2（r01、b03〜b12）の両方を回して、
    # 33表を scripts/b02_run_all_gates.py で b02 と同じように突き合わせる。
    #
    # これが保証すること: 「v1 と一致しているか」を毎回のCIで確かめる（サンプル規模で）。
    # これが保証しないこと: サンプルに無い行・癖・出典への挙動。サンプルの件数の宣言
    # （data/sample/declaration_counts.yaml）が原本の件数を語ること。HEAD の全量で v1 と
    # v2 が一致すること（`full-gate-proof-check` が別に保証しようとするのは「証明が今の
    # コードに対応しているか」までで、真偽そのものは確かめられない）。
    # 詳細は docs/plans/PHASE_B_RECONCILIATION.md §5「保証すること・しないこと」参照。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RYUIKI_REGISTRY_DB: ${{ github.workspace }}/data/db/registry.sqlite
      SCRATCH: /tmp/sample-gate-reports
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: pip install -r requirements.txt

      - name: サンプルを正規のパスへ展開（data/db/*.sqlite・data/processed/*）
        # GITHUB_ACTIONS 環境変数（値 'true'）が既に立っているので、CI ではこれだけで
        # 動く（--i-am-in-a-throwaway-clone は手元の一時 clone で試すときに使う）。
        run: python3 scripts/s02_materialize_sample.py

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: better-sqlite3 のネイティブバインディングをビルド
        # pnpm 10 は既定でサードパーティの postinstall スクリプトを実行しない
        # （`Ignored build scripts` 警告）。build-derived.mjs 等が
        # `require("better-sqlite3")` するのに必要なので、明示的にビルドする。
        working-directory: web
        run: pnpm rebuild better-sqlite3

      - name: v1 を構築（build-derived / build-geo / build-biota）
        working-directory: web
        run: |
          node scripts/build-derived.mjs
          node scripts/build-geo.mjs
          node scripts/build-biota.mjs

      - name: v2 レジストリを構築（r01。--files-only ではないフルビルド）
        run: python3 scripts/r01_build_registry.py

      - name: v2 パイプラインを構築（b03〜b12。--count-overlay でサンプルの件数を使う）
        run: |
          mkdir -p "$SCRATCH"
          python3 scripts/b03_build_observation.py \
            --count-overlay data/sample/declaration_counts.yaml \
            --report "$SCRATCH/phase_b_fact_slice.md"
          python3 scripts/b04_build_cube.py
          python3 scripts/b05_project_v1.py --out data/db/v1_projection.sqlite
          python3 scripts/b06_build_occurrence.py \
            --count-overlay data/sample/declaration_counts.yaml \
            --report "$SCRATCH/phase_b_occurrence.md"
          python3 scripts/b09_build_occurrence_place.py \
            --count-overlay data/sample/declaration_counts.yaml
          python3 scripts/b07_build_occurrence_cube.py \
            --out data/db/v2.sqlite \
            --count-overlay data/sample/declaration_counts.yaml
          python3 scripts/b08_project_occurrence_v1.py \
            --cube-db data/db/v2.sqlite \
            --out data/db/v1_projection_occurrence.sqlite \
            --count-overlay data/sample/declaration_counts.yaml \
            --ias-report "$SCRATCH/phase_b_taxon_assessment.md"
          python3 scripts/b10_project_documents_v1.py
          python3 scripts/b11_project_place_v1.py --out data/db/v1_projection_place.sqlite
          python3 scripts/b12_project_taxon_v1.py --out data/db/v1_projection_taxon.sqlite

      - name: サンプルの成果物を作り直し、コミット済みのものと一致することを確認
        # scripts/s03_verify_sample_artifacts.py は原本を一切開かない（材料化済みの
        # data/db/ryuiki.sqlite＝サンプルそのものと、コミット済みの
        # reports/derived_baseline.json だけを読む）。v1 のスクリプトを触ると
        # derived_baseline.json/.md の差分として、v2 がずれると次のゲートの不一致として見える。
        run: |
          python3 scripts/s03_verify_sample_artifacts.py
          git diff --exit-code \
            data/sample/declaration_counts.yaml data/sample/derived_keys.yaml \
            data/sample/derived_baseline.json data/sample/derived_baseline.md

      - name: 33表の統合ゲート（宣言済み差分18件、一致+宣言済み差分=33、不一致0）
        run: |
          python3 scripts/b02_run_all_gates.py \
            --baseline-json data/sample/derived_baseline.json \
            --expected-diffs data/sample/expected_diffs.yaml \
            --out-md "$SCRATCH/derived_reconciliation_all.md" \
            | tee "$SCRATCH/gate_summary.txt"

      - name: 空振りしていないことを数値で確かめる（一致+宣言済み差分=33、不一致=0、対象外=0、適用した宣言=18）
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          text = (pathlib.Path(os.environ["SCRATCH"]) / "gate_summary.txt").read_text()
          m = re.search(
              r"(\d+)表中 一致: (\d+) / 宣言済み差分のみ: (\d+) / 不一致: (\d+) / 対象外: (\d+)", text
          )
          if not m:
              sys.exit(f"b02_run_all_gates.py の出力からサマリ行を抽出できなかった:\n{text}")
          total, n_match, n_declared, n_mismatch, n_excluded = (int(g) for g in m.groups())
          applied_m = re.search(r"適用した宣言済み差分: (\d+)件", text)
          n_applied = int(applied_m.group(1)) if applied_m else 0

          problems = []
          if total != 33:
              problems.append(f"対象テーブル数が33ではない: {total}")
          if n_match + n_declared != 33:
              problems.append(f"一致+宣言済み差分のみ が33ではない: {n_match}+{n_declared}={n_match + n_declared}")
          if n_mismatch != 0:
              problems.append(f"不一致が0ではない: {n_mismatch}")
          if n_excluded != 0:
              problems.append(f"対象外が0ではない: {n_excluded}")
          if n_applied != 18:
              problems.append(
                  f"適用した宣言済み差分が18（正本20件-サンプル専用で外した2件）ではない: {n_applied}"
              )
          if problems:
              sys.exit("空振りしていないことの確認に失敗した:\n- " + "\n- ".join(problems))
          print(f"OK: 一致={n_match} / 宣言済み差分のみ={n_declared} / 不一致={n_mismatch} / "
                f"対象外={n_excluded} / 適用した宣言済み差分={n_applied}")
          PY

  full-gate-proof-check:
    name: full-gate-proof-check (reports/full_gate_proof.json is current)
    # Issue #29「縮小サンプル＋実行証明」B。原本のある手元で回した
    # scripts/b00_run_full_gate.py の証明（reports/full_gate_proof.json、コミット済み）が
    # 「今の HEAD のパイプラインコード」に対応しているかを確かめる。**証明が本物である
    # ことまでは確かめられない**（手で書ける値でもある）——確かめられるのは「パイプラインの
    # パスの tree/blob ハッシュが証明に書かれた値と一致するか」「data/sample/manifest.json
    # の原本 sha256 が証明の原本 sha256 と一致するか（サンプルと全量の証明が同じ
    # スナップショットに由来すること）」の2点だけ。原本は要らない（証明の JSON と
    # コミット済みのコードだけで完結する）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 証明ファイルがコミットされていることを確認
        run: test -f reports/full_gate_proof.json

      - name: パイプラインのパスの tree/blob ハッシュを HEAD で計算し直し、証明と突き合わせる
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          proof = json.loads(pathlib.Path("reports/full_gate_proof.json").read_text())

          sys.path.insert(0, "scripts")
          import b00_run_full_gate as b00

          expected_paths = b00.collect_pipeline_paths()
          proof_paths = sorted(proof["pipeline_path_hashes"])
          if expected_paths != proof_paths:
              sys.exit(
                  "証明が持つパスの集合が、今のコードが計算するパスの集合と一致しない"
                  f"（証明にしか無い: {sorted(set(proof_paths) - set(expected_paths))} / "
                  f"今のコードにしか無い: {sorted(set(expected_paths) - set(proof_paths))}）。"
                  "scripts/b00_run_full_gate.py を回して証明を更新すること。"
              )

          mismatched = []
          for path in expected_paths:
              result = subprocess.run(
                  ["git", "rev-parse", f"HEAD:{path}"], capture_output=True, text=True, check=True,
              )
              actual = result.stdout.strip()
              expected = proof["pipeline_path_hashes"][path]
              if actual != expected:
                  mismatched.append((path, expected, actual))
          if mismatched:
              lines = "\n".join(f"  - {p}: 証明={e} / HEAD={a}" for p, e, a in mismatched)
              sys.exit(
                  f"パイプラインのパスが証明と食い違う（{len(mismatched)}件）。原本のある手元で "
                  f"`.venv/bin/python3 scripts/b00_run_full_gate.py` を回して証明を更新すること:\n{lines}"
              )
          print(f"OK: パイプラインのパス{len(expected_paths)}件、証明と HEAD が一致")

          manifest = json.loads(pathlib.Path("data/sample/manifest.json").read_text())
          for name, proof_key in (("ryuiki.sqlite", "ryuiki.sqlite"), ("cells.sqlite", "cells.sqlite")):
              manifest_hash = manifest["source_files"][name]
              proof_hash = proof["source_hashes"][proof_key]
              if manifest_hash != proof_hash:
                  sys.exit(
                      f"data/sample/manifest.json の {name} の sha256（{manifest_hash}）が、"
                      f"証明の {proof_key}（{proof_hash}）と食い違う。サンプルと全量の証明が"
                      "同じ原本のスナップショットに由来していない。scripts/s01_build_sample.py と"
                      "scripts/b00_run_full_gate.py を、同じ原本に対して両方回し直すこと。"
                  )
          print("OK: data/sample/manifest.json の原本 sha256 と証明の原本 sha256 が一致")
          PY
