name: CI

# docs/plans/PHASE_B_INTAKE.md #7。原本（ryuiki/cells。data/db/ に置く。.gitignore で
# 除外されているため CI には無い）を必要とせず、`registry/` 配下の手書きファイルと
# リポジトリのコードだけで完結する。Issue #48 PR-5 で v1（派生33表・v1 射影・v1 との突合ゲート）を
# 撤去したので、v2 だけの検査になっている。
#
# - registry: `scripts/r01_build_registry.py --files-only` で作った registry.sqlite から
#   generated.ts / generated-client.ts を再生成し、コミット済みの内容と一致するかを
#   `git diff --exit-code` で機械的に確認する（レジストリと生成物のずれをここで落とす）。
# - web: lint・型検査・テスト（`generated.test.ts` の再生成チェックが走るよう、
#   ここでも --files-only で registry.sqlite を用意する）。
# - reconcile: パイプライン（scripts/b03〜b07・b09・b13・scripts/migrate/*.py・
#   scripts/reconcile/common.py）のフィクスチャテスト（pytest）と、宣言ファイルの構造検証
#   （原本 DB を一切必要としない）。
# - sample-gate: 縮小サンプル（data/sample/）を使い捨ての checkout に展開して v2 を構築し、
#   b04/b07/b09 の自己不変条件と、凍結した serving スナップショット
#   （data/sample/serving_snapshot.json）との一致を見る。
# - full-gate-proof-check: 原本のある手元で回した b00 の証明
#   （reports/serving_fingerprint.json）が今のコードに対応しているかを見る。

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  PNPM_VERSION: "10.18.3"
  # scripts/r01_build_registry.py --files-only の既定の書き込み先は、正規の
  # data/db/registry.sqlite を壊さないよう別ファイル（registry_files_only.sqlite）だが、
  # CI では checkout のたびにまっさらなので、パスをここで明示して
  # r01_build_registry.py / build-registry-ts.mjs / generated.test.ts の3箇所が
  # 確実に同じファイルを指すようにする（3つとも RYUIKI_REGISTRY_DB を見る）。
  RYUIKI_REGISTRY_DB: ${{ github.workspace }}/data/db/registry_files_only.sqlite

jobs:
  registry:
    name: registry (files-only build matches committed generated files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install registry build deps
        run: pip install -r requirements.txt

      - name: Build registry.sqlite（原本DBを一切開かない）
        run: python3 scripts/r01_build_registry.py --files-only

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Regenerate generated.ts / generated-client.ts
        working-directory: web
        run: node scripts/build-registry-ts.mjs

      - name: レジストリと生成物がずれていないことを確認
        run: |
          git diff --exit-code \
            web/src/lib/registry/generated.ts \
            web/src/lib/registry/generated-client.ts

  web:
    name: web (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install registry build deps
        run: pip install -r requirements.txt

      - name: Build registry.sqlite（generated.test.ts が skip されないように用意する）
        run: python3 scripts/r01_build_registry.py --files-only

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: web
        run: pnpm run lint

      - name: 型検査
        working-directory: web
        run: pnpm exec tsc --noEmit

      - name: Test
        working-directory: web
        run: pnpm run test

  reconcile:
    name: reconcile (Phase B pipeline fixtures; does NOT touch real data)
    # ここが保証するのは次の2点だけ:
    #   1. パイプライン（b03〜b07・b09・b13・migrate/*・reconcile/common.py）が
    #      フィクスチャ上で正しく動くこと（scripts/tests/ は自前でフィクスチャ sqlite を
    #      作るので、原本 data/db/*.sqlite は要らないし、ここでは一切開かない）。
    #   2. 宣言ファイルが読めて、原本DBを必要としない範囲の形を満たすこと。
    # 保証しないこと: 実データに対する挙動。原本のある環境でしか走らない（b00）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Phase B パイプラインのフィクスチャテスト（原本DBは使わない）
        run: pytest

      - name: 宣言ファイル（period_exceptions.yaml / time_label_conventions.yaml / source_regions.yaml / occurrence_period_shapes.yaml / occurrence_cube_declarations.yaml）の構造検証（原本DBは使わない）
        run: |
          python3 - <<'PY'
          import pathlib
          import sys

          sys.path.insert(0, "scripts")
          import b07_build_occurrence_cube as b07
          import b09_build_occurrence_place as b09
          from migrate import occurrence_period, period, source_regions

          # scripts/b03_build_observation.py が呼ぶのと同じ読み込みで、かつ
          # CI ではさらに必須キーが揃っていることまで検証する。
          exceptions_path = pathlib.Path("scripts/migrate/period_exceptions.yaml")
          period.validate_period_exceptions_shape(exceptions_path)
          exceptions = period.load_period_exceptions(exceptions_path)
          print(f"OK: {exceptions_path}（{len(exceptions)}件の例外）")

          # time_label_conventions.yaml（センサーの縦線 設計 v2 T2）も同じ
          # 流儀で検証する。
          conventions_path = pathlib.Path("scripts/migrate/time_label_conventions.yaml")
          period.validate_time_label_conventions_shape(conventions_path)
          conventions = period.load_time_label_conventions(conventions_path)
          print(f"OK: {conventions_path}（{len(conventions)}件の宣言）")

          # source_regions.yaml（occurrence〔scripts/b06_build_occurrence.py〕と
          # 土地利用〔scripts/b03_build_observation.py、P-1b〕が consumer ごとに
          # 共有。ここでは consumer を指定せずファイル全体を検証する）/
          # occurrence_period_shapes.yaml（O-1a。scripts/b06_build_occurrence.py
          # が読む）も同じ流儀で検証する。
          source_regions_path = pathlib.Path("scripts/migrate/source_regions.yaml")
          source_regions.validate_source_regions_shape(source_regions_path)
          sources, regions = source_regions.load_source_regions(source_regions_path)
          print(f"OK: {source_regions_path}（出典{len(sources)}件・region{len(regions)}件）")

          period_shapes_path = pathlib.Path("scripts/migrate/occurrence_period_shapes.yaml")
          occurrence_period.validate_occurrence_period_shapes_shape(period_shapes_path)
          shapes = occurrence_period.load_period_shapes(period_shapes_path)
          print(f"OK: {period_shapes_path}（{len(shapes)}形の宣言）")

          # occurrence_cube_declarations.yaml（O-1b。scripts/b07_build_occurrence_cube.py
          # が読む leaf セルの元記録数の宣言）も同じ流儀で検証する。
          cube_declarations_path = pathlib.Path("scripts/migrate/occurrence_cube_declarations.yaml")
          b07.validate_cube_declarations_shape(cube_declarations_path)
          print(f"OK: {cube_declarations_path}")

          # occurrence_place_declarations.yaml（O-2a。scripts/b09_build_occurrence_place.py
          # が読む、ポリゴン数・NULL件数・解決件数の宣言）も同じ流儀で検証する。
          place_declarations_path = pathlib.Path("scripts/migrate/occurrence_place_declarations.yaml")
          b09.validate_place_declarations_shape(place_declarations_path)
          print(f"OK: {place_declarations_path}")
          PY

      - name: taxon_assessment（P-2）の語彙4ファイルの構造検証（原本DBは使わない）
        run: |
          python3 - <<'PY'
          import sys

          sys.path.insert(0, "scripts")
          from registry import build_taxon_assessment as ta

          # registry/taxon/redlist_category.yaml + redlist_category_alias.csv
          # （code の重複・alias の code が語彙に実在すること）。
          codes = ta.load_redlist_category_codes()
          alias = ta.load_redlist_category_alias()
          print(f"OK: {ta.REDLIST_CATEGORY_YAML}（{len(codes)}コード）")
          print(f"OK: {ta.REDLIST_CATEGORY_ALIAS_CSV}（{len(alias)}件のalias）")

          # registry/taxon/assessment_list.yaml（list_id の重複・kind が既知の値）。
          lists = ta.load_assessment_lists()
          print(f"OK: {ta.ASSESSMENT_LIST_YAML}（{len(lists)}件のlist）")

          # registry/taxon/assessment_scope_exclusions.yaml（(list_id,
          # scientific_name) の重複・reasons が既知の値・実測件数〔7種、
          # domestic_origin 6件・subspecies_binomial_contraction 2件〕と一致）。
          exclusions = ta.load_assessment_scope_exclusions()
          print(f"OK: {ta.ASSESSMENT_SCOPE_EXCLUSIONS_YAML}（{len(exclusions)}件の除外）")
          PY

  sample-gate:
    name: sample-gate (v2 pipeline invariants + frozen serving snapshot on the reduced sample)
    # Issue #29「縮小サンプル＋実行証明」A-4、Issue #48 PR-5 で v2 だけに縮めた。data/sample/
    # （コミット済みのテキスト、原本ではない）を使い捨ての checkout の中で正規のパス
    # （data/db/・data/processed/）に展開し、v2（r01、b03〜b13）を回す。b04/b07/b09 の自己不変条件
    # （キューブだけで成り立つ検証・無作為抽出セルの独立再計算）はこの構築の中で走る。
    # そのうえで、画面・API・AI と同じ問い合わせ層（`@/lib/cube`）の出力を凍結した
    # スナップショット（data/sample/serving_snapshot.json）と突き合わせる。
    #
    # これが保証すること: v2 の構築が不変条件を満たすこと、問い合わせ層の出力が（サンプル規模で）
    # コミット済みのスナップショットから動いていないこと。
    # これが保証しないこと: サンプルに無い行・癖・出典への挙動。サンプルの件数の宣言
    # （data/sample/declaration_counts.yaml）が原本の件数を語ること。全量での挙動
    # （`full-gate-proof-check` が確かめるのは「証明が今のコードに対応しているか」まで）。
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RYUIKI_REGISTRY_DB: ${{ github.workspace }}/data/db/registry.sqlite
      SCRATCH: /tmp/sample-gate-reports
      COUNT_OVERLAY: data/sample/declaration_counts.yaml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: pip install -r requirements.txt

      - name: サンプルを正規のパスへ展開（data/db/*.sqlite・data/processed/*）
        # GITHUB_ACTIONS 環境変数（値 'true'）が既に立っているので、CI ではこれだけで
        # 動く（--i-am-in-a-throwaway-clone は手元の一時 clone で試すときに使う）。
        # 本物のチェックアウトでは絶対に実行しない。
        run: python3 scripts/s02_materialize_sample.py

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: better-sqlite3 のネイティブバインディングをビルド
        # pnpm 10 は既定でサードパーティの postinstall スクリプトを実行しない
        # （`Ignored build scripts` 警告）。serving-snapshot.mts が
        # `require("better-sqlite3")` するのに必要なので、明示的にビルドする。
        working-directory: web
        run: pnpm rebuild better-sqlite3

      - name: v2 レジストリを構築（r01。--files-only ではないフルビルド）
        run: python3 scripts/r01_build_registry.py

      - name: v2 を構築（b03 → b04 → b06 → b09 → b07 → b13。--count-overlay でサンプルの件数を使う）
        # `pnpm run build:v2` と同じ順。b04/b07/b09 の自己不変条件はここで走る。
        run: |
          mkdir -p "$SCRATCH"
          python3 scripts/b03_build_observation.py \
            --count-overlay "$COUNT_OVERLAY" \
            --report "$SCRATCH/phase_b_fact_slice.md"
          python3 scripts/b04_build_cube.py
          python3 scripts/b06_build_occurrence.py \
            --count-overlay "$COUNT_OVERLAY" \
            --report "$SCRATCH/phase_b_occurrence.md"
          python3 scripts/b09_build_occurrence_place.py \
            --count-overlay "$COUNT_OVERLAY"
          python3 scripts/b07_build_occurrence_cube.py \
            --out data/db/v2.sqlite \
            --count-overlay "$COUNT_OVERLAY"
          python3 scripts/b13_build_summary.py

      - name: dist（Parquet 配布物）をサンプルから構築
        # Issue #40 Phase D。dist は v2 の派生物で `build:v2` には含めない（`pnpm run build:dist`）。
        # 本番サイズの dist は CI で作らない（手元で1回）。サンプル規模で書き出しが通ることを確かめる。
        run: python3 scripts/d01_build_dist.py

      - name: dist の不変条件を検査（合成データなし・座標が v2 と同一・redistributable で絞らない・旗が registry と一致）
        run: python3 scripts/d02_check_dist.py

      - name: dist を 2 回作って同じバイトになることを確認（決定性）
        run: |
          python3 scripts/d01_build_dist.py --out "$SCRATCH/dist2"
          diff -r dist "$SCRATCH/dist2"

      - name: サンプルの成果物を作り直し、コミット済みのものと一致することを確認
        # scripts/s03_verify_sample_artifacts.py は原本を一切開かない（材料化済みの
        # data/db/ryuiki.sqlite＝サンプルそのものだけを読む）。
        run: |
          python3 scripts/s03_verify_sample_artifacts.py
          git diff --exit-code data/sample/declaration_counts.yaml

      - name: serving スナップショットがコミット済みのものと一致することを確認
        # 免除リストは持たない。スナップショットの更新自体が「出力が変わった」という宣言になる。
        run: |
          git ls-files --error-unmatch data/sample/serving_snapshot.json >/dev/null
          (cd web && pnpm run serving:snapshot -- --mode snapshot)
          if [ -n "$(git status --porcelain -- data/sample/serving_snapshot.json)" ]; then
            git diff data/sample/serving_snapshot.json | head -100
            echo "::error::serving スナップショットが動いた。意図した変更なら、'pnpm run serving:snapshot -- --mode diff' の before/after 表を PR に貼り、data/sample/serving_snapshot.json を更新してコミットすること。"
            exit 1
          fi

  full-gate-proof-check:
    name: full-gate-proof-check (reports/serving_fingerprint.json is current)
    # Issue #29「縮小サンプル＋実行証明」B。原本のある手元で回した
    # scripts/b00_run_full_gate.py の証明（reports/serving_fingerprint.json、コミット済み）が
    # 「今の HEAD のパイプラインコード」に対応しているかを確かめる。**証明が本物である
    # ことまでは確かめられない**（手で書ける値でもある）——確かめられるのは「パイプラインの
    # パスの tree/blob ハッシュが証明に書かれた値と一致するか」「data/sample/manifest.json
    # の原本 sha256 が証明の原本 sha256 と一致するか（サンプルと全量の証明が同じ
    # スナップショットに由来すること）」の2点だけ。原本は要らない（証明の JSON と
    # コミット済みのコードだけで完結する）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 証明ファイルがコミットされていることを確認
        run: test -f reports/serving_fingerprint.json

      - name: パイプラインのパスの tree/blob ハッシュを HEAD で計算し直し、証明と突き合わせる
        # scripts/s04_check_full_gate_proof.py を呼ぶだけ（ロジックは
        # scripts/tests/test_s04_check_full_gate_proof.py で検証済み。
        # ワークフローに直接埋め込んだ Python はテストされないため——レビュー指摘。
        # 実際に、原本キーの付け方が manifest.json と証明で食い違ったまま
        # KeyError で落ちる不具合が、埋め込みコードのまま気づかれずに残っていた）。
        run: python3 scripts/s04_check_full_gate_proof.py
